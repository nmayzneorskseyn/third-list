:root{--p:#5147ed;--ink:#19243d;--muted:#68738b;--line:#e2e6f2}*{box-sizing:border-box}body{margin:0;background:#fafbff;color:var(--ink);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:15px max(18px,calc((100% - 1020px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.brand span{color:var(--p)}.langs{display:flex;background:#f0efff;padding:4px;border-radius:22px}.langs button{border:0;border-radius:20px;background:transparent;padding:8px 15px;font-weight:800;cursor:pointer}.langs .active{background:var(--p);color:white}main{max-width:1020px;margin:30px auto 80px;padding:0 18px}.kicker{font-size:12px;font-weight:850;letter-spacing:.1em;color:var(--p)}h1{font-size:clamp(26px,4vw,38px);margin:8px 0}h2{font-size:27px;margin:8px 0}.subtitle,.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 10px 36px #2330560a}.head{padding:25px 26px 8px}.content{padding:16px 26px 30px}.player{background:#f6f7ff;border:1px solid var(--line);border-radius:14px;padding:17px 20px;margin-bottom:20px}audio{display:block;width:100%;margin-top:12px}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:20px}.tab,.btn{border:1px solid var(--line);border-radius:11px;padding:12px 7px;background:white;color:var(--ink);font-weight:800;cursor:pointer}.tab.active,.btn.primary{background:var(--p);border-color:var(--p);color:white}.panel[hidden]{display:none}.modes{display:flex;gap:8px;margin:12px 0}.btn.active{background:#efedff;color:var(--p);border-color:#bbb5ff}.question{border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.question h4{margin:0 0 12px}.option{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:9px;background:#f9faff;padding:10px 12px;margin:7px 0;cursor:pointer}.option:has(input:checked){background:#f1f0ff;border-color:var(--p)}input{accent-color:var(--p);margin-top:5px}.feedback{padding:12px;border-radius:10px;margin-top:10px;background:#fff0eb}.feedback.good{background:#e8f8ed}.result{background:#f0efff;border:1px solid #c9c4ff;border-radius:14px;padding:18px;margin-top:18px;font-weight:800}.result strong{color:var(--p);font-size:24px}.reading{white-space:pre-line;background:#fafbff;border:1px solid var(--line);padding:20px;border-radius:12px;line-height:1.85}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left}.source{font-size:12px;color:var(--muted)}@media(max-width:600px){.head,.content{padding-left:15px;padding-right:15px}.tab{font-size:11px;padding:10px 2px}.question{padding:12px}}

.note{font-size:13px;color:var(--muted)}.lesson-card{margin-top:24px}.question-count{font-size:13px;color:var(--muted)}@media(max-width:600px){.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><header><div class="brand">MAGIST <span>PRO</span></div><div class="langs"><button id="kk" onclick="setLang('kk')">ҚАЗ</button><button id="ru" class="active" onclick="setLang('ru')">РУС</button></div></header><main><div class="kicker">ENGLISH · LISTENING · PART 3</div><h1 id="heading">Аудирование — раздел 3</h1><p class="subtitle" id="subheading">Все аудиоуроки на одной странице</p><div id="lessons"></div></main><script>const lessons=[{"file": "en-a-family-vacation-72.mp3", "title": "A Family Vacation", "topic": "Традиции и праздники", "level": "B1", "questions": [{"q": "Where is Jenny going?", "options": ["Bermuda", "The Bahamas", "The Caribbean Islands", "Disneyland"], "correct": 1}, {"q": "How is Jenny getting there?", "options": ["Cruise ship", "Driving", "Taking a flight", "By train"], "correct": 0}, {"q": "Where do Jenny and her parents live?", "options": ["New Hampshire", "New York", "Florida", "Texas"], "correct": 1}, {"q": "What kind of dress did Jenny wear for her passport photo?", "options": ["Striped", "Purple", "Plaid", "Polka-dotted"], "correct": 3}, {"q": "What color is Jenny’s suitcase?", "options": ["Blue", "Pink", "Purple", "Yellow"], "correct": 1}, {"q": "What does Jenny stare at when she enters the cruise ship?", "options": ["The ocean", "A chandelier", "A painting", "The captain"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-a-sequence-in-software-development-72.mp3", "title": "A Sequence in Software Development", "topic": "Наука и технологии", "level": "B2", "questions": [{"q": "What kind of role does Lindsey have?", "options": ["A software engineer", "A software developer", "A project manager", "A user acceptance tester"], "correct": 1, "why": "Lindsey is described as a software developer."}, {"q": "Why does Lindsey work in her basement?", "options": ["It is comfortable", "It is dark and reduces eye strain", "It is quiet from the rest of her family", "It has optimal heating conditions"], "correct": 2, "why": "The passage says the basement is quiet from the rest of her family."}, {"q": "What does Lindsey do in her role?", "options": ["She creates applications and manages the code for each", "She manages a team that makes apps", "She performs user acceptance tests", "She provides customer support services"], "correct": 0, "why": "She creates applications and manages the code for each one."}, {"q": "Which activity is NOT mentioned as a check Lindsey performs?", "options": ["Checking spacing", "Checking naming conventions", "Testing commands", "Publishing her program on the internet"], "correct": 3, "why": "The text mentions spacing, naming conventions and testing commands, but not publishing online."}, {"q": "How does Lindsey tell a computer what to do?", "options": ["She reads a book", "She writes commands", "She reads an essay", "She presses buttons"], "correct": 1, "why": "She writes commands that tell a computer what to do."}, {"q": "Which type of apps is NOT mentioned among requests?", "options": ["Games", "Business apps", "Utility apps", "Web apps"], "correct": 3, "why": "The passage lists business apps, games and utility apps, not web apps."}, {"q": "What can Lindsey do to let others use her programs?", "options": ["Ask them", "Give them a reward", "Charge them", "Pay them"], "correct": 2, "why": "She can charge people for using her programs."}, {"q": "What can people request Lindsey to add?", "options": ["Security updates", "New features", "Bug fixes", "New apps"], "correct": 1, "why": "The passage specifically says people can request new features."}], "transcript": "Lindsey is a software developer who lives in a house that is only 12 feet tall. She works in her basement where it is quiet from the rest of her family.\n\nAs a software developer, Lindsey creates applications and manages the code for each. She writes commands that tell a computer what to do. To make sure her programs work, she checks her spacing, checks the naming conventions that she uses and tests her commands.\n\nLindsey can give her programs to other people. People only ask for business apps, games or utility apps. She can charge people for using her programs, and other people can request new features. If she is able to, then she adds them to her programs.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-a-surprising-new-years-eve-snowfall-72.mp3", "title": "A Surprising New Year's Eve Snowfall", "topic": "Традиции и праздники", "level": "B1", "questions": [{"q": "What holiday were they preparing to celebrate?", "options": ["Thanksgiving Day", "New Year's Eve", "Halloween night", "Independence Day"], "correct": 1}, {"q": "What did the weather report say before the party?", "options": ["Rainy and stormy", "Heavy snow", "Cold with no snow", "Warm and sunny"], "correct": 2}, {"q": "About how many people were invited?", "options": ["Fifty", "Fifteen", "Thirty", "Five"], "correct": 1}, {"q": "What unexpected weather event happened?", "options": ["Rain", "Snowflakes began to fall", "Dust storm", "Hail"], "correct": 1}, {"q": "What did people do when the snowfall grew heavier?", "options": ["Took photos", "Went skiing", "Watched TV", "Went downtown"], "correct": 0}, {"q": "What did they use to sled down the small hill?", "options": ["Wooden boards", "Plastic trays", "Pots and pans", "Cardboard boxes"], "correct": 2}, {"q": "What did they drink afterward?", "options": ["Lemonade", "Coffee", "Hot chocolate", "Soda"], "correct": 2}, {"q": "What did the snowy scene remind a friend of?", "options": ["Summer festivals", "Autumn fairs", "Winter holidays in his home country", "Spring celebrations"], "correct": 2}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-at-the-museum-72.mp3", "title": "At the Museum", "topic": "Культура и искусство", "level": "A2", "questions": [{"q": "How old was Danielle?", "options": ["8", "9", "10", "11"], "correct": 2}, {"q": "What exhibit was Danielle excited to see?", "options": ["Fossils", "Architecture", "Animals", "Plants"], "correct": 0}, {"q": "How many tickets did Mindy buy?", "options": ["1", "2", "3", "4"], "correct": 1}, {"q": "How much did the tickets cost?", "options": ["$52", "$53", "$54", "$55"], "correct": 0}, {"q": "What did the receptionist put on them?", "options": ["A badge", "A sticker", "A wristband", "A stamp"], "correct": 2}, {"q": "Where did the receptionist point?", "options": ["Out the door", "To the fossils", "To the ticket counter", "Down the hallway"], "correct": 3}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-bonnie-and-clyde-72.mp3", "title": "Bonnie and Clyde", "topic": "История и общество", "level": "B1", "questions": [{"q": "When were Bonnie and Clyde famous?", "options": ["Early 1700s", "Mid-1800s", "Early 1900s", "Mid-1900s"], "correct": 2}, {"q": "In which country were they famous?", "options": ["Canada", "Germany", "United States", "China"], "correct": 2}, {"q": "Why were they famous?", "options": ["Their robberies", "Their youth", "Their good looks", "Their political careers"], "correct": 0}, {"q": "In what year were they caught?", "options": ["1774", "1934", "1882", "1995"], "correct": 1}, {"q": "When were they ambushed?", "options": ["While visiting a friend", "At lunch", "While hiding in the forest", "On their way home"], "correct": 0}, {"q": "What did the officers do?", "options": ["Took them to a station", "Shot them dead", "Let them go", "Did not catch them"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-breaking-stereotypes-72.mp3", "title": "Breaking Stereotypes", "topic": "Общество и ценности", "level": "B2", "questions": [], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-early-history-of-paper-72.mp3", "title": "The Early History of Paper", "topic": "Промышленность и изобретения", "level": "B2", "questions": [{"q": "What is papyrus?", "options": ["A plant", "A paper material", "A person", "Both a plant and a paper material"], "correct": 3}, {"q": "Where does papyrus grow?", "options": ["South Africa", "Rome", "Egypt", "Greece"], "correct": 2}, {"q": "Which plant part was cut into thin strips?", "options": ["Roots", "Stems", "Leaves", "Flowers"], "correct": 1}, {"q": "What color were the sheets?", "options": ["Brown", "Gray", "Green", "White"], "correct": 3}, {"q": "What were the first books called?", "options": ["Scrolls", "Rolls", "Novels", "Magazines"], "correct": 0}, {"q": "How many layers were used?", "options": ["One", "Two", "Three", "Four"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-facts-about-bats-72.mp3", "title": "Facts About Bats", "topic": "Природа и животные", "level": "B1", "questions": [{"q": "Where do bats live?", "options": ["Underneath the ground", "In abandoned birds’ nests", "In caves", "In bushes"], "correct": 2, "why": "The passage names caves, trees, bridges and old buildings as habitats."}, {"q": "What do bats eat?", "options": ["Nuts", "Other bats", "Grass", "Insects"], "correct": 3, "why": "Some bat species eat insects; others eat fruit."}, {"q": "How long is the lifespan of a bat?", "options": ["Around 10 years", "Around 20 years", "No more than 5 years", "30 years or more"], "correct": 1, "why": "The final sentence says their lifespan is around 20 years."}, {"q": "What color is a bat’s fur?", "options": ["White", "Gray and white striped", "Brown", "Brown with tan spots"], "correct": 2, "why": "Brown is one of the fur colors explicitly mentioned."}, {"q": "What animals hunt bats?", "options": ["Deer", "Raccoons", "Herons", "Prairie dogs"], "correct": 1, "why": "Raccoons are listed among predators of bats."}, {"q": "How many bats can live in a colony?", "options": ["No more than 10", "Thousands", "Hundreds", "Three or four"], "correct": 1, "why": "Colonies can number in the thousands."}, {"q": "When do bats usually come out to hunt?", "options": ["Early in the morning", "At noon", "At night", "During the afternoon"], "correct": 2, "why": "Bats rest during the day and hunt at night."}, {"q": "Where do predators often wait to catch bats?", "options": ["Inside the trees", "Outside a cave opening", "Under the water", "In farm fields"], "correct": 1, "why": "Predators wait outside the opening to a bat cave at nightfall."}], "transcript": "Bats are flying mammals. They have brown, gray, red, tan, or black fur. Some species of bat eat insects while others eat fruit. There are three species of bat that drink blood from cows, horses, and other farm animals.\n\nBats can live in caves, in trees, under bridges and in old buildings. They're social animals that live in colonies that can number in the thousands. Bats rest during the day and come out at night to hunt.\n\nSome of the animals that eat bats include raccoons, snakes, hawks, and weasels. These animals usually wait outside of the opening to a bat's cave in order to capture bats as they fly out at nightfall. Bats have a lifespan of around 20 years.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-fall-colors-72.mp3", "title": "Fall Colors", "topic": "Природа и климат", "level": "B1", "questions": [{"q": "Where can people see fall colors?", "options": ["West coast", "South", "New England", "Southwest"], "correct": 2}, {"q": "What chemical makes leaves green?", "options": ["Carotenoid", "Chlorophyll", "Xanthophyll", "Anthocyanin"], "correct": 1}, {"q": "Which compound breaks down first?", "options": ["Green chlorophyll", "Yellow xanthophyll", "Red anthocyanin", "Orange carotenoid"], "correct": 0}, {"q": "What does photosynthesis convert into food?", "options": ["Water", "Oxygen", "Bugs", "Sunlight"], "correct": 3}, {"q": "What causes chlorophyll to break down?", "options": ["Too much rainfall", "Too little rainfall", "Hot weather", "Shorter days"], "correct": 3}, {"q": "Why are tourists important?", "options": ["They leave litter", "They spend money on vacation", "They never know where to go", "They are noisy"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-giving-back-to-your-environment-72.mp3", "title": "Giving Back to Your Environment", "topic": "Экология", "level": "B1", "questions": [{"q": "What is the first way to help the environment mentioned in the passage?", "options": ["Recycling", "Reducing", "Reusing", "Turning things off"], "correct": 3, "why": "The passage first suggests turning off things that are not in use."}, {"q": "Which resource is NOT mentioned in the first paragraph?", "options": ["Electricity", "Water", "Fuel", "Natural gas"], "correct": 3, "why": "The resources listed are electricity, water and fuel."}, {"q": "When should you turn off the lights?", "options": ["When the curtains are closed", "When it is dark outside", "When it is sunny outside", "When the television is on"], "correct": 2, "why": "The passage suggests switching lights off when it is sunny outside."}, {"q": "Which is NOT one of the 3 Rs?", "options": ["Reuse", "Recycle", "Repurpose", "Reduce"], "correct": 2, "why": "The three Rs are Reduce, Reuse and Recycle."}, {"q": "What should we NOT do when recycling?", "options": ["Place paper separately", "Place plastic separately", "Throw plastic and paper in the trash", "Collect different materials separately"], "correct": 2, "why": "Plastic and paper should be separated instead of thrown in the trash."}, {"q": "What is the purpose of the 3 Rs?", "options": ["Increase the amount of trash", "Reduce the amount of trash", "Make more disposable bags", "Use more resources"], "correct": 1, "why": "The passage says the 3 Rs help reduce trash going to landfills."}, {"q": "What can replace several plastic grocery bags?", "options": ["A large cloth bag", "Several paper cups", "A new plastic bottle", "A cardboard plate"], "correct": 0, "why": "The example recommends using one large cloth bag."}, {"q": "What does “Reuse” mean in the passage?", "options": ["Buy a replacement for every item", "Throw an item away after one use", "Use an item several times or for a new purpose", "Mix plastic and paper in one bin"], "correct": 2, "why": "Reuse means using something multiple times or in a new way."}], "transcript": "There are many ways to give back to your environment without spending money. One way is by turning off anything not in use. This means turning off the lights when it is sunny outside, turning off the faucet when you are brushing your teeth, and even turning off the TV when no one is watching it. These simples acts are a few ways we can save vital resources such as electricity, water, and fuel. Why should we conserve these resources? We should do this because every day is Earth Day! It is never too late to make an impact on your environment and do your part in sustaining our planet.\n\nAnother way is to Reduce, Reuse, and Recycle. The 3 Rs are simple ways that we can do our part in reducing the amount of trash that goes to landfills. Reduce means that we should use less of an item than we need. For example, if you need multiple plastic bags to carry your groceries, you can use one large cloth bag instead. Reuse means that we should use an item multiple times, or even use it for something new instead of throwing it away. Recycle means that we should place plastic and paper separately, rather than throw them in the trash.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-harriet-beecher-stowe-69.mp3", "title": "Harriet Beecher Stowe", "topic": "Литература и история", "level": "B2", "questions": [{"q": "What did Harriet think about slavery?", "options": ["She ignored it", "She thought it was wrong", "She thought it was acceptable", "She thought it was necessary"], "correct": 1}, {"q": "Where did her family hide enslaved people?", "options": ["In their house", "In a woodshed", "In an icehouse", "Outside"], "correct": 0}, {"q": "What was the Underground Railroad?", "options": ["A subway", "A freight railway", "A network helping people escape", "A traditional railroad"], "correct": 2}, {"q": "When was Uncle Tom’s Cabin published?", "options": ["1850", "1852", "1862", "1876"], "correct": 1}, {"q": "What was the novel about?", "options": ["A railroad", "A holiday cabin", "Her uncle", "Slavery and its hardships"], "correct": 3}, {"q": "When did the Civil War begin?", "options": ["1850", "1852", "1862", "1876"], "correct": 2}, {"q": "What were the northern states called?", "options": ["The Union", "The South", "The Confederacy", "The United States"], "correct": 0}, {"q": "Which president invited Harriet to the White House?", "options": ["George Washington", "Abraham Lincoln", "Theodore Roosevelt", "John F. Kennedy"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-henry-ford-69.mp3", "title": "Henry Ford", "topic": "Промышленность и изобретения", "level": "B1", "questions": [{"q": "Who invented the automobile?", "options": ["Thomas Edison", "Henry Ford", "Siegfried Marcus", "Karl Benz"], "correct": 3, "why": "The passage identifies Karl Benz as the inventor of the first automobile."}, {"q": "Why didn't most people buy cars when they first came on the market?", "options": ["People were afraid of automobiles at first", "Cars were too noisy and smelly", "Most people didn't earn enough money to buy one", "There weren't many automobile dealerships where a car could be bought"], "correct": 2, "why": "Early cars were too expensive for working-class people."}, {"q": "Henry Ford's biggest achievement was what?", "options": ["He built a lot of factories to make cars", "He invented the Model T", "His assembly line process made cars cheap", "He helped raise up the working class people"], "correct": 2, "why": "The moving assembly line lowered production costs and made cars affordable."}, {"q": "Using the assembly line, how long did it take to build a Model T?", "options": ["1 day", "6 hours", "12 hours", "8 hours"], "correct": 1, "why": "The text states that a Model T could be built in six hours."}, {"q": "What reduced the costs of production of the Model T so that it became affordable to ordinary people?", "options": ["Assembly line production", "Nothing did. People just liked the car", "Ford decided to fire many employees to cut costs", "The factories were very efficient"], "correct": 0, "why": "Ford’s moving assembly line reduced production costs."}, {"q": "In an assembly line, how is the automobile put together?", "options": ["People move in a line beside the car and put parts on it when they reach it", "Each car is placed in different parts of the factory. Teams put each car together", "The car is on a belt that moves through the factory, and people put a part on it as it passes them", "The car is on a moving belt, and people run alongside it, putting it together"], "correct": 2, "why": "Cars move through the factory while workers add parts as they pass."}, {"q": "In what year did the Model T come out?", "options": ["1903", "1908", "1914", "1920"], "correct": 1, "why": "The passage says the Model T came out in 1908."}, {"q": "Which group could afford cars after Ford reduced production costs?", "options": ["Only wealthy investors", "Only automobile dealers", "Farmers and factory workers", "Only company executives"], "correct": 2, "why": "The text names farmers, construction workers and factory workers as people who could buy a car."}], "transcript": "Most people think Henry Ford invented the automobile. Actually a German named Karl Benz invented the first automobile. Henry built a car, the Model T, that ordinary people could actually afford. There were a lot of cars when the Model T came out in 1908, but they were too expensive for working class people.\n\nFord developed a moving assembly line. The car would move through the factory and people would assemble parts on it as it moved past them. They could build a Model T in six hours. This reduced the costs of producing the cars so much that farmers and construction workers and the factory workers themselves could buy a car. Henry Ford put America on wheels.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-jessies-birthday-72.mp3", "title": "Jessie's Birthday", "topic": "Традиции и праздники", "level": "A2", "questions": [], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-king-arthur-72.mp3", "title": "The Legend of King Arthur", "topic": "Литература и легенды", "level": "B2", "questions": [{"q": "Arthur was a king in which land?", "options": ["France", "Spain", "Britain", "Saxony"], "correct": 2}, {"q": "Guinevere was a…", "options": ["Noble", "Duchess", "Commoner", "Princess"], "correct": 3}, {"q": "A civil war is a war between…", "options": ["Two countries", "Two continents", "Two sides within a city", "Two sides within a country"], "correct": 3}, {"q": "Why could Arthur not forgive the lovers?", "options": ["He was angry", "The law forbade it", "Lancelot was angry", "Guinevere hated him"], "correct": 0}, {"q": "At the Round Table, Arthur sat…", "options": ["As an equal with his knights", "On top of the table", "On a platform", "Outside"], "correct": 0}, {"q": "What was the dream of Camelot?", "options": ["To take over Britain", "To invade Saxony", "To build a kingdom based on honesty and equality", "To build a large castle"], "correct": 2}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-learning-another-language-72.mp3", "title": "How to Learn Another Language", "topic": "Язык и образование", "level": "B1", "questions": [{"q": "What percentage of people speak a second language?", "options": ["65–70 million", "50–80 million", "50–80 percent", "65–70 percent"], "correct": 3}, {"q": "Can adults learn a second language?", "options": ["Yes", "No", "Maybe not", "Never"], "correct": 0}, {"q": "About how many words are needed for fluency, according to the text?", "options": ["100", "10,000", "100,000", "1,000"], "correct": 1}, {"q": "What is an accent?", "options": ["How you pronounce words", "Your household", "Vocabulary and grammar", "How you study"], "correct": 0}, {"q": "What is input?", "options": ["Reading and writing", "Reading and listening", "Listening and speaking", "Speaking and writing"], "correct": 1}, {"q": "What helps you learn to speak?", "options": ["Only input", "Input and output", "Only grammar", "Only writing"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-online-instructions-72.mp3", "title": "Online Instructions", "topic": "Технологии", "level": "B1", "questions": [{"q": "What is the largest cost of distributing paper instructions?", "options": ["Transportation", "Printing services", "Materials", "Staffing"], "correct": 2, "why": "The text identifies materials as the largest contributor to the cost."}, {"q": "What costs can be avoided by switching to online instructions?", "options": ["Advertising", "Inventory handling and storage", "Marketing", "Human resources"], "correct": 1, "why": "Online instructions avoid handling and storage costs for inventory."}, {"q": "What is one benefit of online instructions?", "options": ["Higher inventory costs", "More material handling", "Increased paper production", "Labor savings"], "correct": 3, "why": "Labor and staffing costs are among the possible savings."}, {"q": "What happens to transportation costs when online instructions are implemented?", "options": ["They decrease", "They increase", "They stay the same", "They double"], "correct": 0, "why": "Materials no longer need to be transported, eliminating those costs."}, {"q": "Which activities create staffing costs for paper instructions?", "options": ["Sales and marketing", "Purchasing and handling", "Scientific research", "Computer engineering"], "correct": 1, "why": "The passage names purchasing, handling and development of paper instructions."}, {"q": "How much is the company expected to save by switching from paper to online instructions?", "options": ["Hundreds of dollars", "Thousands of dollars", "Millions of dollars", "Billions of dollars"], "correct": 2, "why": "The final paragraph describes a multi-million-dollar savings impact."}, {"q": "Why are transportation costs avoided after adopting online instructions?", "options": ["Fewer employees travel to work", "There is no need to transport physical materials", "Shipping becomes faster", "The company buys new vehicles"], "correct": 1, "why": "The text says materials no longer need to be transported."}, {"q": "What is the overall expected effect of online instructions on company expenses?", "options": ["A significant reduction in costs", "A significant increase in paper purchases", "No change in operating expenses", "Higher inventory storage costs"], "correct": 0, "why": "The passage describes substantial savings across several cost categories."}], "transcript": "The cost of materials is the largest contributor to the cost of distributing paper instructions. With the implementation of online instructions, the material costs would be avoided entirely. Also, the cost of handling and storage of inventory would be avoided by using online instructions.\n\nAnother consideration is the elimination of transportation costs since there would be no need to transport materials once online instructions are implemented.\n\nOther relevant savings could include labor and staffing costs for activities that require purchasing, handling, and development of paper instructions. These savings are expected to contribute significantly to the cost savings attributed to the adoption of online instructions.\n\nIn all, implementing online instructions is expected to have a multi-million-dollar savings impact on the company.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-our-inner-solar-system-72.mp3", "title": "Our Inner Solar System", "topic": "Наука и космос", "level": "B1", "questions": [{"q": "What does the word \"planet\" mean in Greek?", "options": ["Wanderer", "Watcher", "Whisperer", "Weaver"], "correct": 0, "why": "The passage explains that planet comes from the Greek word for wanderer."}, {"q": "How many planets are located in our inner solar system?", "options": ["Three", "Four", "Six", "Eight"], "correct": 1, "why": "The passage identifies the four closest planets to the Sun."}, {"q": "Which planet is closest to the Sun?", "options": ["Mercury", "Venus", "Earth", "Mars"], "correct": 0, "why": "Mercury is described as the closest planet to the Sun."}, {"q": "Why is Venus hotter than Mercury?", "options": ["It orbits closer to the Sun at times", "Its features include volcanic rock", "It possesses a magnetic field, unlike Mercury", "Its atmosphere traps heat"], "correct": 3, "why": "Venus has a thick atmosphere that traps heat."}, {"q": "What happened to the Soviet spacecraft Venera 13?", "options": ["It returned back to Earth with information about Venus", "It expired after landing on Venus", "It traveled around Venus taking pictures", "It left Venus for the Sun"], "correct": 1, "why": "The passage says Venera 13 was crushed by the conditions on Venus."}, {"q": "Which planet besides Earth has active volcanoes?", "options": ["Mercury", "Venus", "Mars", "None of these"], "correct": 1, "why": "The text states that Venus also has active volcanoes."}, {"q": "Where do scientists believe water can be found on Mars?", "options": ["In its atmosphere", "At its equator", "At its ice cap", "Buried deep within its sands"], "correct": 2, "why": "The passage locates water at the Martian ice cap."}, {"q": "How many years does it take Mars to circle the Sun?", "options": ["Less than one year", "More than one year", "More than two years", "More than three years"], "correct": 1, "why": "Mars takes almost two Earth years to orbit the Sun."}], "transcript": "The four closest planets to orbit our Sun comprise the inner solar system. These include Earth's closest neighbors. Planet is a word that derives from the Greek word “wanderer.” The wanderer closest to the Sun is tiny Mercury.\n\nThe next planet in orbit is Venus. Its thick atmosphere traps heat, so the planet is the hottest in the solar system. Its dense gravity crushed the Soviet spacecraft Venera 13 in 1982 when it landed to gather information. Like Earth, it also has active volcanoes.\n\nFarther out from Earth's orbit lies Mars, named after the god of war. Mars' atmosphere is less thick than Venus' or Earth's. Like Earth, the planet features water, although only at its ice cap. It takes Mars almost two Earth years to complete its orbit around the Sun.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-painting-a-room-72.mp3", "title": "Tips for Painting a Room", "topic": "Архитектура и строительство", "level": "B1", "questions": [{"q": "Why hang color swatches before painting?", "options": ["To decorate", "To see colors in room lighting", "To remember names", "To compare two colors"], "correct": 1}, {"q": "Why paint your own rooms?", "options": ["Avoid strangers", "Finish immediately", "Save money", "Avoid walking on carpet"], "correct": 2}, {"q": "What is the first step in planning?", "options": ["Choose a date", "Make a supplies list", "Draw on the wall", "Clean the walls"], "correct": 1}, {"q": "What should you do after choosing a color?", "options": ["Buy enough paint", "Put down drop cloths", "Wash brushes", "Set up a ladder"], "correct": 0}, {"q": "Which item is essential?", "options": ["Utility knife", "Turpentine", "Paint pans", "Measuring tape"], "correct": 2}, {"q": "Where do you buy supplies?", "options": ["Grocery store", "Drugstore", "Farmers market", "Home improvement store"], "correct": 3}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-paper-making-72.mp3", "title": "Paper Making", "topic": "Промышленность и изобретения", "level": "B1", "questions": [{"q": "What did Cai Lun make from bark, wood chips and old nets?", "options": ["Papyrus", "Cloth", "Paper", "Rope"], "correct": 2, "why": "The dried fibrous mixture became paper."}, {"q": "Who kept the papermaking process secret for 500 years?", "options": ["The Japanese", "The Islamic world", "The Spanish", "The Chinese"], "correct": 3, "why": "The technique originated in China and remained secret for 500 years."}, {"q": "Through which world did papermaking knowledge reach Spain?", "options": ["Islamic", "Egyptian", "Roman", "Chinese"], "correct": 0, "why": "The passage says knowledge spread through the Islamic world."}, {"q": "Approximately how long did it take to spread from Spain in 1150 to Europe by 1600?", "options": ["200 years", "350 years", "650 years", "450 years"], "correct": 3, "why": "1600 minus 1150 equals 450 years."}, {"q": "What is the mixture of plant and wood fibers called?", "options": ["Mixture", "Pulp", "Solution", "Mush"], "correct": 1, "why": "The text calls the fibrous papermaking mixture pulp."}, {"q": "What can be added to improve paper quality?", "options": ["Wood chips", "Bark", "Cloth", "Papyrus"], "correct": 2, "why": "Pieces of cloth are sometimes added to improve paper quality."}, {"q": "How was the wet fibrous mixture prepared before drying?", "options": ["It was frozen", "It was pressed after draining the water", "It was burned", "It was mixed with ink"], "correct": 1, "why": "Cai Lun drained the water, pressed the mixture and let it dry."}, {"q": "What mainly distinguishes fine paper from newspaper paper?", "options": ["The amount of fibers in the pulp", "The country of manufacture", "The colour of the water", "The age of the machines"], "correct": 0, "why": "The passage identifies fiber content as the main difference."}], "transcript": "While the Romans were still using papyrus in 105 AD, a Chinese court official, named Cai Lun, boiled some bark and wood chips and old nets together with water and a little lye. He drained the water off and pressed the fibrous mixture and then allowed it to dry. The result was paper, much like our modern version, but thicker and coarser. The process was kept a secret for 500 years.\n\nEventually the knowledge spread through the Islamic world to Spain in 1150 AD. By the year 1600, paper was being made throughout Europe. Modern paper making processes are just refinements on the methods used for centuries. The major difference between high quality paper like that used for wedding invitations and the paper used for newspapers is the amount of fibers in the pulp mixture. Pieces of cloth are often added to improve the quality of the paper.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-portland-72.mp3", "title": "Portland, Oregon: The Rose City", "topic": "Города и география", "level": "B1", "questions": [{"q": "Which state is Portland in?", "options": ["Washington", "Nevada", "Oregon", "California"], "correct": 2}, {"q": "How large is the city within Oregon?", "options": ["Not large", "Somewhat large", "Very large", "The largest"], "correct": 3}, {"q": "Why is it called the Rose City?", "options": ["It is large", "Roses grow there", "It is beautiful", "People move there"], "correct": 1}, {"q": "How many state residents live in the city?", "options": ["A few", "Half", "More than half", "All"], "correct": 2}, {"q": "Why have many people moved to Portland?", "options": ["Quality of life", "It is new", "It rains a lot", "There are jobs"], "correct": 0}, {"q": "What is Portland known for?", "options": ["Mountains", "Parks", "Rivers", "Deserts"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-running-for-office-69.mp3", "title": "Marco Wants to Run for Office", "topic": "Политика и экономика", "level": "B1", "questions": [{"q": "What is the name of Marco’s wife?", "options": ["Victoria", "Emilia", "Susan", "Sandra"], "correct": 3}, {"q": "Where does Marco live?", "options": ["Miami", "Jacksonville", "Tallahassee", "Orlando"], "correct": 1}, {"q": "How many children does Marco have?", "options": ["Five", "Three", "Four", "Two"], "correct": 2}, {"q": "Which city was his father mayor of?", "options": ["Tallahassee", "Miami", "Jacksonville", "Orlando"], "correct": 1}, {"q": "What is his father’s name?", "options": ["Jose", "Wade", "Thomas", "Juan"], "correct": 3}, {"q": "When did his father stop being mayor?", "options": ["1989", "1999", "1987", "None of these"], "correct": 3}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-starting-a-business-72.mp3", "title": "Starting a Business", "topic": "Политика и экономика", "level": "B1", "questions": [{"q": "How old was the narrator when starting a business?", "options": ["11", "9", "6", "8"], "correct": 1}, {"q": "What services did the narrator provide?", "options": ["Garden services", "Car services", "Food services", "Education services"], "correct": 0}, {"q": "How much did the lawnmower cost?", "options": ["$100", "$5 per hour", "$25 per hour", "20 hours"], "correct": 0}, {"q": "How did the narrator view the purchase?", "options": ["Regretted it", "Wanted to take it to college", "A good investment", "Threw it away"], "correct": 2}, {"q": "What did the narrator study?", "options": ["Agriculture", "History", "Science", "Landscaping"], "correct": 3}, {"q": "What hourly rate did the narrator settle on as an adult?", "options": ["$5", "$25", "$30", "Free"], "correct": 1}], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-the-challenges-and-rewards-of-volunteering-abroad-72.mp3", "title": "The Challenges and Rewards of Volunteering Abroad", "topic": "Общество и ценности", "level": "B2", "questions": [], "transcript": "", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "en-thomas-edison-69.mp3", "title": "Thomas Edison", "topic": "Промышленность и изобретения", "level": "B1", "questions": [{"q": "Thomas Edison graduated from which university?", "options": ["Yale", "Harvard", "None", "Princeton"], "correct": 2, "why": "The passage says he had very little formal schooling and dropped out of school."}, {"q": "He built a laboratory in what city?", "options": ["Menlo Park, New Jersey", "Cleveland, Ohio", "Newark, New Jersey", "Detroit, Michigan"], "correct": 0, "why": "He eventually established a laboratory in Menlo Park, New Jersey."}, {"q": "Edison had a disability. What was it?", "options": ["Partial blindness", "Attention deficit hyperactivity disorder", "Deafness", "Paralysis"], "correct": 2, "why": "His hearing loss became permanent."}, {"q": "What was the machine that started him on the road to becoming an inventor?", "options": ["A light bulb", "A motion picture projector", "A record player", "A telegraph"], "correct": 3, "why": "The telegraph fascinated Edison and led him to improve its machinery."}, {"q": "Edison got his first job working for:", "options": ["The US Army", "The railroad", "Western Union", "A newspaper"], "correct": 1, "why": "He left school to work for the railroad."}, {"q": "Edison held over 1000 patents, including those for:", "options": ["The record player and the incandescent light bulb", "The incandescent light bulb and the phonograph", "The incandescent light bulb and the telephone", "The phonograph and the telegraph"], "correct": 1, "why": "The passage identifies the phonograph and incandescent light bulb as his inventions."}, {"q": "Which method did Edison use when experimenting?", "options": ["Trial and error", "Mathematical simulation", "Random selection of assistants", "Survey research"], "correct": 0, "why": "He tried another approach whenever one did not work."}, {"q": "What did the incandescent light bulb help develop?", "options": ["Electric lighting around the world", "Steam-powered railways", "Wireless radio networks", "Paper-based telegraphy"], "correct": 0, "why": "The text connects the bulb with the spread of electric lighting worldwide."}], "transcript": "Possibly the most famous American inventor, Thomas Edison set a world record by holding 1093 patents. Born in 1847 in Ohio, he was the youngest of seven children, only four of whom survived to become adults. In early childhood, Thomas developed hearing loss, which became permanent. His hearing difficulties later influenced his work as an inventor.\n\nHe had very little formal schooling because his deafness interfered. But he read everything he could get his hands on. He dropped out of school, going to work for the railroad. He became fascinated by the telegraph, which at the time transmitted by marking dots and dashes on paper. When telegraphers had to be able to hear, he turned to improving the machines and was able to add a printer. He then became an inventor full time, eventually setting up a laboratory in Menlo Park, New Jersey.\n\nBecause he was self-educated, Edison approached experimentation differently than did scientists. He used the trial and error method. If one thing didn't work, he tried another. In this manner he first invented the phonograph, which evolved into the record player, and the incandescent light bulb. The light bulb led to the development of electric lighting throughout the world.\n\nEdison was brilliant, but a difficult man to work with and often neglected his family. He died in 1931 of diabetes.", "translation": {"kk": "", "ru": ""}, "words": []}, {"file": "english-history-of-chocolate-QMY9ukSoCvk.mp3", "title": "History of Chocolate", "topic": "Промышленность и изобретения", "level": "B1", "questions": [{"q": "Where do cocoa beans come from?", "options": ["Cacao trees", "Cocoa trees", "Maize", "Coffee"], "correct": 1}, {"q": "Which civilization first used cocoa beans according to the passage?", "options": ["Mayan", "Olmec", "Aztec", "Inca"], "correct": 1}, {"q": "Which use was NOT described?", "optio
