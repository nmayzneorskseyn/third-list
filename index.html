let lang='ru',selected=0,mode='quiz',answers={},finished=false,filter='all',query='';const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function T(k){return I[lang][k]};function topics(){return [...new Set(LESSONS.map(x=>x.topic))]};function renderSidebar(){let ts=['all',...topics()];$('filters').innerHTML=ts.map(t=>`<button class="pill ${filter===t?'on':''}" data-topic="${escapeHTML(t)}">${escapeHTML(t==='all'?T('all'):t)}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.topic;renderSidebar()});let shown=LESSONS.map((x,i)=>({...x,i})).filter(x=>(filter==='all'||x.topic===filter)&&(x.title+' '+x.topic+' '+x.file).toLowerCase().includes(query.toLowerCase()));$('counter').textContent=shown.length+' / '+LESSONS.length;$('lessonlist').innerHTML=shown.map(x=>`<button class="lesson ${x.i===selected?'on':''}" data-index="${x.i}"><b>${x.i+1}. ${escapeHTML(x.title)}</b><small>${escapeHTML(x.topic)} · ${escapeHTML(x.level)} · ${x.questions.length?x.questions.length+' Q':'Audio'}</small></button>`).join('');$('lessonlist').querySelectorAll('button').forEach(b=>b.onclick=()=>select(+b.dataset.index))}function select(i){selected=i;answers={};finished=false;mode='quiz';const x=LESSONS[i];$('title').textContent=x.title;$('topic').textContent=x.topic;$('level').textContent=x.level+' · '+(i+1)+' / '+LESSONS.length;$('player').src=encodeURI(x.file);$('player').load();$('status').textContent='';renderSidebar();renderQuestions();window.scrollTo({top:0,behavior:'smooth'})}function renderQuestions(){$('quiz').classList.toggle('on',mode==='quiz');$('test').classList.toggle('on',mode==='test');$('modehint').textContent=T(mode);const qs=LESSONS[selected].questions;$('finish').hidden=!qs.length;$('finish').textContent=T('finish');$('score').textContent=finished?`${T('result')}: ${qs.filter((q,i)=>answers[i]===q.correct).length} / ${qs.length}`:'';if(!qs.length){$('questions').innerHTML=`<div class="notice">${T('pending')}</div>`;return}$('questions').innerHTML=qs.map((q,i)=>`<div class="question"><h3>${i+1}. ${escapeHTML(q.q)}</h3>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" data-i="${i}" data-j="${j}" ${answers[i]===j?'checked':''} ${finished?'disabled':''}><span>${'ABCD'[j]}. ${escapeHTML(o)}</span></label>`).join('')}${(finished||(mode==='quiz'&&answers[i]!==undefined))?`<div class="feedback"><b class="${answers[i]===q.correct?'correct':'wrong'}">${answers[i]===q.correct?T('correct'):T('wrong')}</b><div>${T('answer')}: ${'ABCD'[q.correct]}. ${escapeHTML(q.options[q.correct])}</div></div>`:''}</div>`).join('');$('questions').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{answers[+inp.dataset.i]=+inp.dataset.j;if(mode==='quiz')renderQuestions()})}function translate(){document.documentElement.lang=lang;$('subtitle').textContent=T('subtitle');$('lessonLabel').textContent=T('lessons');$('search').placeholder=T('search');$('questionLabel').textContent=T('questions');$('instructionsLabel').textContent=T('instructionsLabel');$('instructions').textContent=T('instructions');document.querySelector('[data-i="restart"]').textContent=T('restart');$('ru').classList.toggle('on',lang==='ru');$('kk').classList.toggle('on',lang==='kk');renderSidebar();renderQuestions()}$('search').oninput=e=>{query=e.target.value;renderSidebar()};$('ru').onclick=()=>{lang='ru';translate()};$('kk').onclick=()=>{lang='kk';translate()};$('quiz').onclick=()=>{mode='quiz';answers={};finished=false;renderQuestions()};$('test').onclick=()=>{mode='test';answers={};finished=false;renderQuestions()};$('finish').onclick=()=>{finished=true;renderQuestions()};$('restart').onclick=()=>{$('player').currentTime=0;$('player').play().catch(()=>{})};$('player').onerror=()=>{$('status').textContent=T('missing')};select(0);translate();
</script></body></html>
