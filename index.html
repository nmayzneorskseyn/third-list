<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MAGIST PRO · Listening 4</title><style>
:root{--bg:#f6f8fc;--ink:#17223b;--muted:#66738a;--line:#dfe6f0;--primary:#3759d7;--pale:#eef2ff;--good:#087b5a;--bad:#b42336}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}.shell{max-width:1040px;margin:auto;padding:24px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.brand{font-size:20px;font-weight:900;letter-spacing:-.5px}.brand span{color:var(--primary)}.langs,.tabs,.modes{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 14px;color:var(--ink);font-weight:700;cursor:pointer}.btn.active,.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}.btn:focus-visible{outline:3px solid #94a8ff;outline-offset:2px}.hero{background:linear-gradient(125deg,#142a61,#425dce);color:white;padding:32px;border-radius:24px}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.82;font-weight:800}.hero h1{font-size:clamp(26px,4vw,40px);line-height:1.16;margin:10px 0}.hero p{opacity:.9;margin:0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.pill{border:1px solid #ffffff50;border-radius:99px;padding:5px 11px;font-size:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;margin-top:18px;box-shadow:0 5px 25px #1c315808}.panel h2{margin:0 0 14px;font-size:21px}.sub{color:var(--muted);font-size:14px}.audio{width:100%;margin:16px 0 6px}.time{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.progress{height:6px;background:#e7edfa;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;width:0;background:var(--primary)}.question{padding:19px 0;border-top:1px solid var(--line)}.question:first-child{border-top:0}.qhead{display:flex;gap:10px;align-items:flex-start;font-weight:800;margin-bottom:12px}.num{flex:none;background:var(--pale);color:var(--primary);border-radius:9px;min-width:31px;text-align:center;padding:2px 5px}.options{display:grid;gap:8px}.option{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.option:has(input:checked){border-color:var(--primary);background:#f3f5ff}.option input{margin-top:5px;accent-color:var(--primary)}.option.correct{border-color:#9ed8c4;background:#edf9f4}.option.wrong{border-color:#f2b3bb;background:#fff1f2}.explain{margin-top:12px;border-left:3px solid var(--primary);background:#f5f7ff;border-radius:0 10px 10px 0;padding:12px 15px}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.result{padding:15px;border-radius:12px;background:#edf9f4;font-weight:800;margin-top:16px}.reading{white-space:pre-line;line-height:1.85}.words{width:100%;border-collapse:collapse}.words th,.words td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}.words th{color:var(--muted);font-size:12px;text-transform:uppercase}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}@media(max-width:600px){.shell{padding:14px 12px 50px}.hero{padding:24px 20px}.panel{padding:19px 16px}.words{font-size:13px}.words th,.words td{padding:8px 5px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">MAGIST <span>PRO</span></div><div class="langs"><button class="btn" id="kkBtn" onclick="setLang('kk')">ҚАЗ</button><button class="btn active" id="ruBtn" onclick="setLang('ru')">РУС</button></div></header><section class="hero"><div class="eyebrow">English Listening · Lesson 04 · B1</div><h1>Fall Colors</h1><p id="topic"></p><div class="meta"><span class="pill">6 questions</span><span class="pill">00:50 audio</span><span class="pill">Quiz / Test</span></div></section><section class="panel"><h2 id="listenTitle"></h2><p class="sub" id="listenDesc"></p><audio id="player" class="audio" controls preload="metadata"><source src="en-fall-colors-72.mp3" type="audio/mpeg"></audio><div class="time"><span id="clock">00:00 / 00:50</span><span id="limitText"></span></div><div class="progress"><div id="bar"></div></div></section><section class="panel"><div class="top" style="margin-bottom:12px"><h2 id="questionsTitle" style="margin:0"></h2><div class="modes"><button id="quizBtn" class="btn active" onclick="setMode('quiz')">Quiz</button><button id="testBtn" class="btn" onclick="setMode('test')">Test</button></div></div><p class="sub" id="modeDesc"></p><div id="questions"></div><div class="actions"><button class="btn primary" id="checkBtn" onclick="checkAll()"></button><button class="btn" id="resetBtn" onclick="resetAnswers()"></button></div><div id="result" class="result hidden"></div></section><section class="panel"><div class="tabs"><button class="btn active" id="transcriptTab" onclick="setTab('transcript')">Transcript</button><button class="btn" id="translationTab" onclick="setTab('translation')"></button><button class="btn" id="synonymsTab" onclick="setTab('synonyms')">Synonyms</button></div><div id="reading" class="reading" style="margin-top:20px"></div><div id="synonyms" class="hidden" style="margin-top:18px"></div></section><footer class="footer">MAGIST PRO · English Listening Practice</footer></main><script>
const END=50;let lang='ru',mode='quiz',tab='transcript',answers={},revealed={};const $=id=>document.getElementById(id);const tr=(ru,kk)=>lang==='ru'?ru:kk;
const story=`Autumn is the season of color. The leaves turn from green to red, yellow, and orange. The turning of the leaves is a popular time to travel to places like New England, Michigan, Minnesota, and Wisconsin to see the beautiful colors. This tourism is an important part of the economy in these areas.

From spring through the end of summer, the leaves are green because of the chemical called chlorophyll, which converts the energy of light into food for the tree, a process called photosynthesis. But when temperatures drop and the days get shorter, the chlorophyll breaks down. There are other compounds that help in photosynthesis, but they are yellow, orange, red and even pink or purple. Once the green goes away, the other brilliant colors shine forth for a few weeks. Then the leaves fall and it's time to rake.`;
const storyRu=`Осень — время ярких красок. Листья меняют цвет с зелёного на красный, жёлтый и оранжевый. В этот период многие путешествуют в Новую Англию, Мичиган, Миннесоту и Висконсин, чтобы полюбоваться осенними красками. Такой туризм играет важную роль в экономике этих регионов.

С весны до конца лета листья зелёные благодаря хлорофиллу — веществу, которое помогает превращать энергию света в пищу для дерева в процессе фотосинтеза. Когда температура снижается, а дни становятся короче, хлорофилл разрушается. В листьях есть и другие соединения, участвующие в фотосинтезе: они имеют жёлтый, оранжевый, красный и даже розовый или фиолетовый цвет. Когда зелёный пигмент исчезает, другие яркие цвета становятся заметны на несколько недель. Затем листья опадают, и приходит время их сгребать.`;
const storyKk=`Күз — түрлі түстер мезгілі. Жапырақтар жасыл түстен қызыл, сары және қызғылт сары түске өзгереді. Осы кезде көптеген адамдар күзгі әсем түстерді көру үшін Жаңа Англияға, Мичиганға, Миннесотаға және Висконсинге саяхаттайды. Мұндай туризм осы аймақтардың экономикасы үшін маңызды.

Көктемнен жаздың соңына дейін жапырақтар хлорофилл деп аталатын заттың арқасында жасыл болады. Хлорофилл жарық энергиясын ағашқа қажетті қорекке айналдыруға көмектеседі; бұл үдеріс фотосинтез деп аталады. Ауа температурасы төмендеп, күн қысқарғанда хлорофилл ыдырайды. Жапырақтарда фотосинтезге қатысатын сары, қызғылт сары, қызыл, тіпті қызғылт және күлгін түсті басқа қосылыстар да бар. Жасыл түс жоғалғаннан кейін осы ашық түстер бірнеше апта бойы көрінеді. Содан кейін жапырақтар түсіп, оларды жинайтын уақыт келеді.`;
const Q=[
{q:'Where is a good area to view the fall colors in the trees?',o:['The west coast','The south','New England','The southwest'],a:2,ru:'В тексте Новая Англия (New England) названа одним из мест, куда люди приезжают смотреть на яркие осенние листья.',kk:'Мәтінде Жаңа Англия (New England) адамдар күзгі түрлі түсті жапырақтарды көруге баратын аймақтардың бірі ретінде аталады.'},
{q:'What chemical causes the green color in leaves?',o:['Carotenoid','Chlorophyll','Xanthophyll','Anthocyanin'],a:1,ru:'Листья зелёные благодаря хлорофиллу (chlorophyll). Именно это вещество придаёт им зелёный цвет.',kk:'Жапырақтың жасыл түсі хлорофиллге (chlorophyll) байланысты. Жасыл түсті беретін зат — осы.'},
{q:'Which compound breaks down first?',o:['The green chlorophyll','The yellow xanthophyll','The red anthocyanin','The orange carotenoid'],a:0,ru:'При понижении температуры и сокращении светового дня разрушается зелёный хлорофилл. После этого становятся заметны другие цвета.',kk:'Температура төмендеп, күн қысқарғанда жасыл хлорофилл ыдырайды. Содан кейін басқа түстер анық көріне бастайды.'},
{q:'Photosynthesis is the chemical process that converts what into food for plants?',o:['Water','Oxygen','Bugs','Sunlight'],a:3,ru:'В тексте сказано, что при фотосинтезе энергия света превращается в пищу для дерева. Поэтому правильный вариант — sunlight (солнечный свет).',kk:'Мәтінде фотосинтез кезінде жарық энергиясы ағашқа қажетті қорекке айналатыны айтылады. Сондықтан дұрыс жауап — sunlight (күн сәулесі).'},
{q:'What causes the chlorophyll to break down?',o:['Too much rainfall','Too little rainfall','Hot weather','Shorter days'],a:3,ru:'Автор объясняет: когда дни становятся короче и температура падает, хлорофилл разрушается. Из предложенных вариантов подходит shorter days.',kk:'Автор күн қысқарып, температура төмендегенде хлорофилл ыдырайтынын түсіндіреді. Берілген нұсқалардың ішінен shorter days дұрыс.'},
{q:'Tourists are important because they:',o:['Leave litter behind them.','Spend a lot of money on vacation.','Never know where they’re going.','Can be very obnoxious.'],a:1,ru:'В тексте сказано, что туризм важен для экономики этих районов. Это связано с тем, что путешественники тратят деньги во время поездок.',kk:'Мәтінде туризм осы аймақтардың экономикасы үшін маңызды делінген. Себебі саяхатшылар демалыс кезінде ақша жұмсайды.'}
];
const W=[['autumn','fall','осень','күз'],['leaves','foliage','листья','жапырақтар'],['turn','change','меняться','өзгеру'],['popular','well-liked','популярный','танымал'],['beautiful','gorgeous','красивый','әдемі'],['economy','economic system','экономика','экономика'],['chemical','substance','химическое вещество','химиялық зат'],['convert','transform','превращать','айналдыру'],['energy','power','энергия','қуат'],['drop','decrease','снижаться','төмендеу'],['shorter','briefer','короче','қысқарақ'],['break down','decompose','разрушаться','ыдырау'],['brilliant','vivid','яркий','ашық түсті'],['rake','gather leaves','сгребать листья','жапырақтарды жинау']];
function setLang(v){lang=v;$('ruBtn').classList.toggle('active',v==='ru');$('kkBtn').classList.toggle('active',v==='kk');render()}
function setMode(v){mode=v;revealed={};$('quizBtn').classList.toggle('active',v==='quiz');$('testBtn').classList.toggle('active',v==='test');$('result').classList.add('hidden');render()}
function choose(i,j){answers[i]=j;if(mode==='quiz')revealed[i]=true;renderQuestions()}
function renderQuestions(){let root=$('questions');root.innerHTML='';Q.forEach((q,i)=>{let node=document.createElement('div');node.className='question';let header=document.createElement('div');header.className='qhead';header.innerHTML='<span class="num">'+(i+1)+'</span><span>'+q.q+'</span>';node.append(header);let options=document.createElement('div');options.className='options';q.o.forEach((o,j)=>{let label=document.createElement('label');label.className='option'+(revealed[i]&&j===q.a?' correct':'')+(revealed[i]&&answers[i]===j&&j!==q.a?' wrong':'');let inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.checked=answers[i]===j;inp.addEventListener('change',()=>choose(i,j));label.append(inp,document.createTextNode(String.fromCharCode(65+j)+'. '+o));options.append(label)});node.append(options);if(revealed[i]){let explanation=document.createElement('div');explanation.className='explain';explanation.innerHTML='<strong>'+tr('Правильный ответ','Дұрыс жауап')+': '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'</strong><div>'+q[lang]+'</div>';node.append(explanation)}root.append(node)})}
function checkAll(){Q.forEach((q,i)=>{if(answers[i]!==undefined)revealed[i]=true});renderQuestions();let answered=Object.keys(answers).length;let correct=Q.filter((q,i)=>answers[i]===q.a).length;let el=$('result');el.classList.remove('hidden');el.textContent=tr('Результат','Нәтиже')+': '+correct+' / '+Q.length+' · '+tr('Отвечено','Жауап берілді')+': '+answered+' / '+Q.length}
function resetAnswers(){answers={};revealed={};$('result').classList.add('hidden');renderQuestions()}
function setTab(v){tab=v;renderTab()}
function renderTab(){['transcript','translation','synonyms'].forEach(v=>$(v+'Tab').classList.toggle('active',v===tab));$('reading').classList.toggle('hidden',tab==='synonyms');$('synonyms').classList.toggle('hidden',tab!=='synonyms');if(tab==='transcript')$('reading').textContent=story;if(tab==='translation')$('reading').textContent=lang==='ru'?storyRu:storyKk;if(tab==='synonyms'){$('synonyms').innerHTML='<table class="words"><thead><tr><th>English</th><th>Synonym</th><th>'+tr('Перевод','Аудармасы')+'</th></tr></thead><tbody>'+W.map(w=>'<tr><td>'+w[0]+'</td><td>'+w[1]+'</td><td>'+w[lang==='ru'?2:3]+'</td></tr>').join('')+'</tbody></table>'}}
function render(){$('topic').textContent=tr('Географическое положение, погода и климат','Географиялық орналасу, ауа райы және климат');$('listenTitle').textContent=tr('Прослушайте аудио','Аудионы тыңдаңыз');$('listenDesc').textContent=tr('Прослушайте запись и ответьте на вопросы.','Аудиожазбаны тыңдап, сұрақтарға жауап беріңіз.');$('limitText').textContent=tr('Окончание: 00:50','Аяқталуы: 00:50');$('questionsTitle').textContent=tr('Вопросы по аудио','Аудио бойынша сұрақтар');$('modeDesc').textContent=mode==='quiz'?tr('Quiz: объяснение появляется после выбора ответа.','Quiz: жауап таңдалғаннан кейін түсіндірме көрсетіледі.'):tr('Test: ответы и объяснения появятся после проверки.','Test: жауаптар мен түсіндірмелер тексеруден кейін көрсетіледі.');$('checkBtn').textContent=tr('Проверить ответы','Жауаптарды тексеру');$('resetBtn').textContent=tr('Начать заново','Қайта бастау');$('translationTab').textContent=tr('Перевод','Аударма');renderQuestions();renderTab()}
const audio=$('player');let stopping=false;function clampAudio(){if(!Number.isFinite(audio.currentTime))return;if(audio.currentTime>=END){if(!stopping){stopping=true;audio.pause();audio.currentTime=END;setTimeout(()=>stopping=false,0)}}else if(audio.currentTime<0)audio.currentTime=0;let t=Math.min(audio.currentTime,END);$('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 00:50';$('bar').style.width=(t/END*100)+'%'}audio.addEventListener('timeupdate',clampAudio);audio.addEventListener('seeking',clampAudio);audio.addEventListener('play',()=>{if(audio.currentTime>=END){audio.pause();audio.currentTime=0}});audio.addEventListener('ended',clampAudio);render();
</script></body></html>
