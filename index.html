ді табысты үйрену үшін input пен output дағдыларының екеуін де дамыту қажет. Сәттілік!","ru":"По оценкам, от 65 до 70 процентов людей говорят на втором языке. Многие из них выросли в семьях, где под одной крышей сосуществовали разные культуры, поэтому они научились говорить на разных языках ещё в детстве. Однако некоторые люди изучают другой язык уже во взрослом возрасте.\n\nИзучать второй язык трудно. Чтобы действительно свободно им владеть, нужно выучить около 10 000 слов. Также необходимо изучать лексику и грамматику. У вас даже может быть акцент — особый способ произношения слов, характерный для вашей страны или культуры.\n\nЕсть две стороны изучения другого языка. Первая называется input — восприятие информации через чтение и аудирование. Вторая называется output — использование языка в письме и устной речи.\n\nЧтобы успешно изучить второй язык, нужно развивать и input, и output. Удачи!"},"words":[{"word":"estimated","syn":"calculated","ru":"оцениваемый","kk":"бағаланған"},{"word":"diverse","syn":"varied","ru":"разнообразный","kk":"алуан түрлі"},{"word":"fluent","syn":"proficient","ru":"свободно владеющий","kk":"еркін меңгерген"},{"word":"vocabulary","syn":"lexicon","ru":"словарный запас","kk":"сөздік қор"},{"word":"unique","syn":"distinctive","ru":"уникальный","kk":"ерекше"},{"word":"involves","syn":"includes","ru":"включает","kk":"қамтиды"},{"word":"successful","syn":"effective","ru":"успешный","kk":"табысты"},{"word":"aspects","syn":"features","ru":"аспекты","kk":"қырлары"}],"durationSeconds":null,"supplemental":true,"limit":57},{"file":"en-online-instructions-72.mp3","title":"Online Instructions","topic":"Технологии","level":"B1","questions":[{"q":"What is the largest cost of distributing paper instructions?","options":["Transportation","Printing services","Materials","Staffing"],"correct":2,"why":"The text identifies materials as the largest contributor to the cost."},{"q":"What costs can be avoided by switching to online instructions?","options":["Advertising","Inventory handling and storage","Marketing","Human resources"],"correct":1,"why":"Online instructions avoid handling and storage costs for inventory."},{"q":"What is one benefit of online instructions?","options":["Higher inventory costs","More material handling","Increased paper production","Labor savings"],"correct":3,"why":"Labor and staffing costs are among the possible savings."},{"q":"What happens to transportation costs when online instructions are implemented?","options":["They decrease","They increase","They stay the same","They double"],"correct":0,"why":"Materials no longer need to be transported, eliminating those costs."},{"q":"Which activities create staffing costs for paper instructions?","options":["Sales and marketing","Purchasing and handling","Scientific research","Computer engineering"],"correct":1,"why":"The passage names purchasing, handling and development of paper instructions."},{"q":"How much is the company expected to save by switching from paper to online instructions?","options":["Hundreds of dollars","Thousands of dollars","Millions of dollars","Billions of dollars"],"correct":2,"why":"The final paragraph describes a multi-million-dollar savings impact."},{"q":"Why are transportation costs avoided after adopting online instructions?","options":["Fewer employees travel to work","There is no need to transport physical materials","Shipping becomes faster","The company buys new vehicles"],"correct":1,"why":"The text says materials no longer need to be transported."},{"q":"What is the overall expected effect of online instructions on company expenses?","options":["A significant reduction in costs","A significant increase in paper purchases","No change in operating expenses","Higher inventory storage costs"],"correct":0,"why":"The passage describes substantial savings across several cost categories."}],"transcript":"The cost of materials is the largest contributor to the cost of distributing paper instructions. With the implementation of online instructions, the material costs would be avoided entirely. Also, the cost of handling and storage of inventory would be avoided by using online instructions.\n\nAnother consideration is the elimination of transportation costs since there would be no need to transport materials once online instructions are implemented.\n\nOther relevant savings could include labor and staffing costs for activities that require purchasing, handling, and development of paper instructions. These savings are expected to contribute significantly to the cost savings attributed to the adoption of online instructions.\n\nIn all, implementing online instructions is expected to have a multi-million-dollar savings impact on the company.","translation":{"kk":"Қағаз нұсқаулықтарды тарату шығындарының ең үлкен бөлігі материалдарға жұмсалады. Онлайн нұсқаулықтарды енгізу арқылы материалдарға кететін шығындар толығымен жойылады. Сонымен қатар қорларды өңдеу және сақтау шығындары да болмайды.\n\nТағы бір маңызды мәселе — тасымалдау шығындарын жою. Онлайн нұсқаулықтар енгізілгеннен кейін материалдарды тасымалдау қажет болмайды.\n\nҚосымша үнемдеуге қағаз нұсқаулықтарды сатып алу, өңдеу және әзірлеуге қатысты еңбек пен қызметкерлер шығындары да кіруі мүмкін. Бұл үнемдеу онлайн нұсқаулықтарға көшудің жалпы экономикалық тиімділігіне айтарлықтай үлес қосады деп күтіледі.\n\nЖалпы алғанда, онлайн нұсқаулықтарды енгізу компанияға миллиондаған доллар үнемдеуге мүмкіндік береді деп болжанады.","ru":"Стоимость материалов составляет наибольшую часть расходов на распространение бумажных инструкций. При внедрении онлайн-инструкций эти затраты на материалы можно полностью исключить. Также исчезнут расходы на обработку и хранение запасов.\n\nЕщё один важный фактор — устранение транспортных расходов, поскольку после внедрения онлайн-инструкций не потребуется перевозить материалы.\n\nДополнительная экономия может включать затраты на труд и персонал, связанные с закупкой, обработкой и разработкой бумажных инструкций. Ожидается, что это внесёт значительный вклад в общую экономию от перехода на онлайн-инструкции.\n\nВ целом предполагается, что внедрение онлайн-инструкций позволит компании сэкономить миллионы долларов."},"words":[{"word":"materials","syn":"resources","kk":"материалдар","ru":"материалы"},{"word":"distribute","syn":"deliver","kk":"тарату","ru":"распространять"},{"word":"implementation","syn":"introduction","kk":"енгізу","ru":"внедрение"},{"word":"inventory","syn":"stock","kk":"қорлар","ru":"запасы"},{"word":"handling","syn":"management","kk":"өңдеу","ru":"обработка"},{"word":"storage","syn":"keeping","kk":"сақтау","ru":"хранение"},{"word":"transportation costs","syn":"shipping expenses","kk":"тасымалдау шығындары","ru":"транспортные расходы"},{"word":"elimination","syn":"removal","kk":"жою","ru":"устранение"},{"word":"labor","syn":"work","kk":"еңбек","ru":"труд"},{"word":"staffing costs","syn":"personnel expenses","kk":"қызметкерлерге кететін шығындар","ru":"затраты на персонал"},{"word":"purchasing","syn":"buying","kk":"сатып алу","ru":"закупка"},{"word":"significantly","syn":"considerably","kk":"айтарлықтай","ru":"значительно"},{"word":"adoption","syn":"introduction","kk":"қолданысқа енгізу","ru":"переход на использование"},{"word":"multi-million-dollar","syn":"worth millions","kk":"миллиондаған долларлық","ru":"многомиллионный"}],"durationSeconds":null,"limit":null},{"file":"en-our-inner-solar-system-72.mp3","title":"Our Inner Solar System","topic":"Наука и космос","level":"B1","questions":[{"q":"What does the word \"planet\" mean in Greek?","options":["Wanderer","Watcher","Whisperer","Weaver"],"correct":0,"why":"The passage explains that planet comes from the Greek word for wanderer."},{"q":"How many planets are located in our inner solar system?","options":["Three","Four","Six","Eight"],"correct":1,"why":"The passage identifies the four closest planets to the Sun."},{"q":"Which planet is closest to the Sun?","options":["Mercury","Venus","Earth","Mars"],"correct":0,"why":"Mercury is described as the closest planet to the Sun."},{"q":"Why is Venus hotter than Mercury?","options":["It orbits closer to the Sun at times","Its features include volcanic rock","It possesses a magnetic field, unlike Mercury","Its atmosphere traps heat"],"correct":3,"why":"Venus has a thick atmosphere that traps heat."},{"q":"What happened to the Soviet spacecraft Venera 13?","options":["It returned back to Earth with information about Venus","It expired after landing on Venus","It traveled around Venus taking pictures","It left Venus for the Sun"],"correct":1,"why":"The passage says Venera 13 was crushed by the conditions on Venus."},{"q":"Which planet besides Earth has active volcanoes?","options":["Mercury","Venus","Mars","None of these"],"correct":1,"why":"The text states that Venus also has active volcanoes."},{"q":"Where do scientists believe water can be found on Mars?","options":["In its atmosphere","At its equator","At its ice cap","Buried deep within its sands"],"correct":2,"why":"The passage locates water at the Martian ice cap."},{"q":"How many years does it take Mars to circle the Sun?","options":["Less than one year","More than one year","More than two years","More than three years"],"correct":1,"why":"Mars takes almost two Earth years to orbit the Sun."}],"transcript":"The four closest planets to orbit our Sun comprise the inner solar system. These include Earth's closest neighbors. Planet is a word that derives from the Greek word “wanderer.” The wanderer closest to the Sun is tiny Mercury.\n\nThe next planet in orbit is Venus. Its thick atmosphere traps heat, so the planet is the hottest in the solar system. Its dense gravity crushed the Soviet spacecraft Venera 13 in 1982 when it landed to gather information. Like Earth, it also has active volcanoes.\n\nFarther out from Earth's orbit lies Mars, named after the god of war. Mars' atmosphere is less thick than Venus' or Earth's. Like Earth, the planet features water, although only at its ice cap. It takes Mars almost two Earth years to complete its orbit around the Sun.","translation":{"kk":"Күнге ең жақын орналасқан төрт ғаламшар ішкі Күн жүйесін құрайды. Олардың арасында Жерге көршілес ғаламшарлар бар. «Ғаламшар» сөзінің ағылшын тіліндегі атауы гректің «кезбе» деген сөзінен шыққан. Күнге ең жақын орналасқан шағын ғаламшар — Меркурий.\n\nОдан кейінгі ғаламшар — Шолпан. Оның қалың атмосферасы жылуды ұстап қалады, сондықтан ол Күн жүйесіндегі ең ыстық ғаламшар. 1982 жылы Шолпанға ақпарат жинау үшін қонған кеңестік «Венера-13» ғарыш аппараты қатты қысым әсерінен зақымданды. Жер сияқты, Шолпанда да белсенді жанартаулар бар.\n\nЖер орбитасынан әрі қарай соғыс құдайының атымен аталған Марс орналасқан. Марстың атмосферасы Шолпан мен Жердікінен жұқалау. Жердегідей, онда да су бар, бірақ ол мұзды қалпақтарында кездеседі. Марс Күнді шамамен екі Жер жылында бір рет айналып шығады.","ru":"Четыре ближайшие к Солнцу планеты образуют внутреннюю Солнечную систему. Среди них находятся ближайшие соседи Земли. Слово «планета» происходит от греческого слова «странник». Ближе всех к Солнцу расположена маленькая планета Меркурий.\n\nСледующая планета — Венера. Её плотная атмосфера удерживает тепло, поэтому Венера является самой горячей планетой Солнечной системы. В 1982 году советский аппарат «Венера-13», приземлившийся для сбора информации, был повреждён суровыми условиями. Как и на Земле, на Венере есть действующие вулканы.\n\nДальше от орбиты Земли находится Марс, названный в честь бога войны. Его атмосфера менее плотная, чем атмосферы Венеры и Земли. Как и на Земле, там есть вода, хотя она находится в ледяных шапках. Марсу требуется почти два земных года, чтобы совершить оборот вокруг Солнца."},"words":[{"word":"inner solar system","syn":"—","kk":"ішкі Күн жүйесі","ru":"внутренняя Солнечная система"},{"word":"orbit","syn":"revolve around","kk":"орбита, айналу","ru":"орбита, вращаться"},{"word":"neighbor","syn":"—","kk":"көрші","ru":"сосед"},{"word":"wanderer","syn":"—","kk":"кезбе","ru":"странник"},{"word":"Mercury","syn":"—","kk":"Меркурий","ru":"Меркурий"},{"word":"Venus","syn":"—","kk":"Шолпан","ru":"Венера"},{"word":"thick atmosphere","syn":"—","kk":"қалың атмосфера","ru":"плотная атмосфера"},{"word":"trap heat","syn":"—","kk":"жылуды ұстап қалу","ru":"удерживать тепло"},{"word":"spacecraft","syn":"—","kk":"ғарыш аппараты","ru":"космический аппарат"},{"word":"active volcanoes","syn":"—","kk":"белсенді жанартаулар","ru":"действующие вулканы"},{"word":"Mars","syn":"—","kk":"Марс","ru":"Марс"},{"word":"ice cap","syn":"—","kk":"мұзды қалпақ","ru":"ледяная шапка"},{"word":"complete an orbit","syn":"—","kk":"толық айналып шығу","ru":"совершить полный оборот"}],"durationSeconds":null,"limit":null},{"file":"en-painting-a-room-72.mp3","title":"Tips for Painting a Room","topic":"Архитектура и строительство","level":"B1","questions":[{"q":"Why hang color swatches before painting?","options":["To decorate","To see colors in room lighting","To remember names","To compare two colors"],"correct":1},{"q":"Why paint your own rooms?","options":["Avoid strangers","Finish immediately","Save money","Avoid walking on carpet"],"correct":2},{"q":"What is the first step in planning?","options":["Choose a date","Make a supplies list","Draw on the wall","Clean the walls"],"correct":1},{"q":"What should you do after choosing a color?","options":["Buy enough paint","Put down drop cloths","Wash brushes","Set up a ladder"],"correct":0},{"q":"Which item is essential?","options":["Utility knife","Turpentine","Paint pans","Measuring tape"],"correct":2},{"q":"Where do you buy supplies?","options":["Grocery store","Drugstore","Farmers market","Home improvement store"],"correct":3},{"q":"What should you do before starting to paint a room?","options":["Make a list of needed supplies","Remove every window","Replace all electrical wiring","Buy new furniture"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"Why are paint swatches useful?","options":["They show how colors look in the room","They remove old paint","They dry the walls","They measure room temperature"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."}],"transcript":"When you need a room painted in your home you can save some money by doing the work yourself. Making a detailed plan for your painting project adds organization to the task.\n\nThe first step is to make a list of the items you need from the home improvement store. Your list should include paintbrushes, paint rollers, drop cloths, paint pans and painter's tape.\n\nWhen choosing a paint color for your walls, it helps to take home a few color swatches. Attach the swatches to a wall to see how the colors look as the light changes in the room. Once you decide on a color, go back to the store to get enough paint for the entire room.","translation":{"kk":"Үйдегі бөлмені бояу қажет болса, жұмысты өзіңіз орындап, ақша үнемдей аласыз. Жұмысты дұрыс ұйымдастыру үшін егжей-тегжейлі жоспар жасаңыз.\n\nАлғашқы қадам — құрылыс және жөндеу дүкенінен қажет заттардың тізімін жасау. Тізімге қылқаламдар, бояу білікшелері, қорғаныш жабындар, бояу науалары және бояу таспасы кіруі керек.\n\nҚабырға түсін таңдағанда бірнеше түс үлгісін үйге әкелген пайдалы. Жарық өзгергенде түстің қалай көрінетінін байқау үшін оларды қабырғаға бекітіңіз. Түсті таңдаған соң дүкенге қайта барып, бүкіл бөлмеге жететін бояу сатып алыңыз.","ru":"Когда вам нужно покрасить комнату дома, вы можете сэкономить деньги, выполнив работу самостоятельно. Подробный план поможет организовать работу.\n\nПервый шаг — составить список необходимых материалов из магазина товаров для ремонта. В него должны входить кисти, валики, защитные покрытия, лотки для краски и малярная лента.\n\nВыбирая цвет стен, полезно взять домой несколько образцов. Прикрепите их к стене, чтобы увидеть, как цвет меняется при разном освещении. Выбрав цвет, вернитесь в магазин и купите достаточно краски для всей комнаты."},"words":[{"word":"Save money","syn":"Cut costs","ru":"Ақша үнемдеу","kk":"Экономить деньги"},{"word":"Detailed","syn":"Thorough","ru":"Егжей-тегжейлі","kk":"Подробный"},{"word":"Supplies","syn":"Materials","ru":"Құрал-жабдықтар","kk":"Материалы"},{"word":"Include","syn":"Contain","ru":"Қамту","kk":"Включать"},{"word":"Choose","syn":"Select","ru":"Таңдау","kk":"Выбирать"},{"word":"Purchase","syn":"Buy","ru":"Сатып алу","kk":"Покупать"},{"word":"Enough","syn":"Sufficient","ru":"Жеткілікті","kk":"Достаточно"},{"word":"Attach","syn":"Fix","ru":"Бекіту","kk":"Прикреплять"}],"durationSeconds":43,"supplemental":true,"limit":43},{"file":"en-paper-making-72.mp3","title":"Paper Making","topic":"Промышленность и изобретения","level":"B1","questions":[{"q":"What did Cai Lun make from bark, wood chips and old nets?","options":["Papyrus","Cloth","Paper","Rope"],"correct":2,"why":"The dried fibrous mixture became paper."},{"q":"Who kept the papermaking process secret for 500 years?","options":["The Japanese","The Islamic world","The Spanish","The Chinese"],"correct":3,"why":"The technique originated in China and remained secret for 500 years."},{"q":"Through which world did papermaking knowledge reach Spain?","options":["Islamic","Egyptian","Roman","Chinese"],"correct":0,"why":"The passage says knowledge spread through the Islamic world."},{"q":"Approximately how long did it take to spread from Spain in 1150 to Europe by 1600?","options":["200 years","350 years","650 years","450 years"],"correct":3,"why":"1600 minus 1150 equals 450 years."},{"q":"What is the mixture of plant and wood fibers called?","options":["Mixture","Pulp","Solution","Mush"],"correct":1,"why":"The text calls the fibrous papermaking mixture pulp."},{"q":"What can be added to improve paper quality?","options":["Wood chips","Bark","Cloth","Papyrus"],"correct":2,"why":"Pieces of cloth are sometimes added to improve paper quality."},{"q":"How was the wet fibrous mixture prepared before drying?","options":["It was frozen","It was pressed after draining the water","It was burned","It was mixed with ink"],"correct":1,"why":"Cai Lun drained the water, pressed the mixture and let it dry."},{"q":"What mainly distinguishes fine paper from newspaper paper?","options":["The amount of fibers in the pulp","The country of manufacture","The colour of the water","The age of the machines"],"correct":0,"why":"The passage identifies fiber content as the main difference."}],"transcript":"While the Romans were still using papyrus in 105 AD, a Chinese court official, named Cai Lun, boiled some bark and wood chips and old nets together with water and a little lye. He drained the water off and pressed the fibrous mixture and then allowed it to dry. The result was paper, much like our modern version, but thicker and coarser. The process was kept a secret for 500 years.\n\nEventually the knowledge spread through the Islamic world to Spain in 1150 AD. By the year 1600, paper was being made throughout Europe. Modern paper making processes are just refinements on the methods used for centuries. The major difference between high quality paper like that used for wedding invitations and the paper used for newspapers is the amount of fibers in the pulp mixture. Pieces of cloth are often added to improve the quality of the paper.","translation":{"kk":"Римдіктер біздің заманымыздың 105 жылы әлі папирус қолданып жүргенде, Цай Лунь есімді қытай сарай қызметкері ағаш қабығын, ағаш жаңқаларын және ескі торларды су мен аздап сілті қосып қайнатқан. Содан кейін суды ағызып, талшықты қоспаны сығып, кептірген. Нәтижесінде қазіргі қағазға ұқсас, бірақ қалың әрі кедір-бұдыр қағаз пайда болған. Бұл әдіс 500 жыл бойы құпия сақталған.\n\nКейін қағаз жасау білімі ислам әлемі арқылы таралып, 1150 жылы Испанияға жетті. 1600 жылға қарай қағаз бүкіл Еуропада жасала бастады. Қазіргі өндіріс әдістері ғасырлар бойы қолданылған тәсілдердің жетілдірілген нұсқасы ғана. Үйлену тойына шақыру қағаздары сияқты жоғары сапалы қағаз бен газет қағазының басты айырмашылығы — қағаз массасындағы талшық мөлшері. Сапасын жақсарту үшін кейде мата қиындылары қосылады.","ru":"Когда римляне в 105 году нашей эры ещё использовали папирус, китайский придворный чиновник по имени Цай Лунь сварил древесную кору, щепки и старые сети с водой и небольшим количеством щёлочи. Затем он слил воду, спрессовал волокнистую смесь и дал ей высохнуть. Получилась бумага, похожая на современную, но более толстая и грубая. Этот способ держали в секрете 500 лет.\n\nПозже знания распространились через исламский мир и достигли Испании в 1150 году. К 1600 году бумагу производили по всей Европе. Современные методы изготовления бумаги — усовершенствованные версии способов, применявшихся веками. Главное отличие высококачественной бумаги, например для свадебных приглашений, от газетной заключается в количестве волокон в бумажной массе. Для улучшения качества иногда добавляют кусочки ткани."},"words":[{"word":"papyrus","syn":"—","kk":"папирус","ru":"папирус"},{"word":"court official","syn":"—","kk":"сарай қызметкері","ru":"придворный чиновник"},{"word":"bark","syn":"—","kk":"ағаш қабығы","ru":"древесная кора"},{"word":"wood chips","syn":"—","kk":"ағаш жаңқалары","ru":"древесная щепа"},{"word":"lye","syn":"—","kk":"сілті","ru":"щёлочь"},{"word":"fibrous","syn":"—","kk":"талшықты","ru":"волокнистый"},{"word":"press","syn":"—","kk":"сығу, басу","ru":"прессовать"},{"word":"coarse","syn":"—","kk":"кедір-бұдыр","ru":"грубый"},{"word":"spread","syn":"—","kk":"таралу","ru":"распространяться"},{"word":"refinement","syn":"—","kk":"жетілдіру","ru":"усовершенствование"},{"word":"pulp","syn":"—","kk":"қағаз массасы","ru":"бумажная масса"},{"word":"fiber","syn":"—","kk":"талшық","ru":"волокно"},{"word":"cloth","syn":"—","kk":"мата","ru":"ткань"},{"word":"quality","syn":"—","kk":"сапа","ru":"качество"}],"durationSeconds":null,"limit":null},{"file":"en-portland-72.mp3","title":"Portland, Oregon: The Rose City","topic":"Города и география","level":"B1","questions":[{"q":"What state is Portland located in?","options":["Washington","Nevada","Oregon","California"],"correct":2,"ru":"В тексте прямо сказано, что Портленд — крупнейший город штата Орегон.","kk":"Мәтінде Портлендтің Орегон штатындағы ең үлкен қала екені нақты айтылған.","why":""},{"q":"In the state, how large is the city?","options":["It is not large","It is somewhat large","It is very large","It is the largest"],"correct":3,"ru":"Портленд назван крупнейшим городом штата Орегон, поэтому подходит «It is the largest».","kk":"Портленд Орегон штатындағы ең үлкен қала деп сипатталған, сондықтан «It is the largest» дұрыс.","why":""},{"q":"Why is the city also known as Rose City?","options":["It is large","Roses grow there","It is beautiful","People move there"],"correct":1,"ru":"Прозвище «Город роз» связано с тем, что в городе растёт много сортов роз.","kk":"«Раушандар қаласы» атауы қалада раушан гүлдерінің көптеген түрі өсетіндігіне байланысты.","why":""},{"q":"How many residents of the state live in the city?","options":["A few of its residents","Half of its residents","More than half of its residents","All of its residents"],"correct":2,"ru":"В записи говорится «more than half», то есть больше половины жителей штата.","kk":"Мәтінде «more than half» делінген, яғни штат тұрғындарының жартысынан астамы.","why":""},{"q":"Why have people moved to Portland?","options":["Its quality of life","Portland is a new city","It rains a lot there","There are jobs available"],"correct":0,"ru":"В тексте сказано, что людей привлекают природная красота и качество жизни.","kk":"Мәтінде адамдарды табиғаттың сұлулығы мен өмір сапасы қызықтыратыны айтылған.","why":""},{"q":"Portland is renowned for its","options":["Mountains","Parks","Rivers","Deserts"],"correct":1,"ru":"Последнее предложение сообщает, что город известен многочисленными парками и мостами.","kk":"Соңғы сөйлемде қаланың көптеген саябақтары мен көпірлерімен танымал екені айтылған.","why":""},{"q":"Which state is Portland in?","options":["Washington","Nevada","Oregon","California"],"correct":2},{"q":"How large is the city within Oregon?","options":["Not large","Somewhat large","Very large","The largest"],"correct":3}],"transcript":"","translation":{"kk":"Мен Портлендте тұрамын. Портленд — АҚШ-тың солтүстік-батысында орналасқан Орегон штатындағы ең үлкен қала. Онда раушан гүлдерінің көптеген түрі өсетіндіктен, қаланы «Раушандар қаласы» деп атайды. Қаланы салу үшін көптеген ағаш кесілген, ал олардың түбірлері қалып қойғандықтан, ол «Түбірлер қаласы» деген атпен де белгілі.\n\nПортленд — АҚШ-тағы халық саны бойынша 26-орындағы қала. Штат тұрғындарының жартысынан астамы осы қалада тұрады. Елдің әр өңірінен көптеген адамдар, әсіресе жастар, Портлендке көшіп келген. Оларды табиғатының әсемдігі мен өмір сапасы қызықтырады. Қала көптеген саябақтары мен көпірлерімен танымал.","ru":"Я живу в Портленде. Портленд — крупнейший город штата Орегон, расположенный на северо-западе США. Город называют «Городом роз», потому что здесь растёт множество сортов роз. Он также известен как «Город пней»: при строительстве города пришлось вырубить много деревьев, и пни часто оставались на месте.\n\nПортленд — 26-й по численности населения город Америки. Более половины жителей штата проживают в этом городе. Многие люди со всей страны, особенно молодёжь, переехали в Портленд. Их привлекают природная красота и качество жизни. Город известен многочисленными парками и мостами."},"words":[{"word":"located","syn":"situated","ru":"расположенный","kk":"орналасқан"},{"word":"largest","syn":"biggest","ru":"самый большой","kk":"ең үлкен"},{"word":"known","syn":"famous","ru":"известный","kk":"танымал"},{"word":"varieties","syn":"types","ru":"разновидности","kk":"түрлері"},{"word":"residents","syn":"inhabitants","ru":"жители","kk":"тұрғындар"},{"word":"attracted","syn":"drawn","ru":"привлечённые","kk":"қызыққан"},{"word":"natural beauty","syn":"scenic beauty","ru":"природная красота","kk":"табиғат сұлулығы"},{"word":"renowned","syn":"well-known","ru":"знаменитый","kk":"әйгілі"},{"word":"quality of life","syn":"living standard","ru":"качество жизни","kk":"өмір сапасы"},{"word":"moved","syn":"relocated","ru":"переехали","kk":"көшіп келді"}],"durationSeconds":null,"supplemental":true,"limit":44},{"file":"en-running-for-office-69.mp3","title":"Marco Wants to Run for Office","topic":"Политика и экономика","level":"B1","questions":[{"q":"What is the name of Marco's wife?","options":["Victoria","Emilia","Susan","Sandra"],"correct":3,"ru":"В тексте прямо сказано «His wife, Sandra». Виктория и Эмилия — имена его детей, а не жены.","kk":"Мәтінде «His wife, Sandra» деп нақты айтылған. Виктория мен Эмилия — оның балаларының есімдері.","why":""},{"q":"Where does Marco live?","options":["Miami","Jacksonville","Tallahassee","Orlando"],"correct":1,"ru":"Первое предложение сообщает, что Марко живёт в Джэксонвилле. Майами упоминается как город, где его отец был мэром.","kk":"Бірінші сөйлемде Марконың Джэксонвиллде тұратыны айтылған. Майами — оның әкесі мэр болған қала.","why":""},{"q":"How many children does Marco have?","options":["Five","Three","Four","Two"],"correct":2,"ru":"В первом абзаце сказано «He has four children», а во втором перечислены четыре имени.","kk":"Бірінші абзацта «He has four children» делінген, ал екінші абзацта төрт баланың аты аталады.","why":""},{"q":"Marco's father was mayor of which city?","options":["Tallahassee","Miami","Jacksonville","Orlando"],"correct":1,"ru":"В последнем предложении говорится, что Хуан, отец Марко, был мэром Майами.","kk":"Соңғы сөйлемде Марконың әкесі Хуан Майами қаласының мэрі болғаны жазылған.","why":""},{"q":"What is the name of Marco's father?","options":["Jose","Wade","Thomas","Juan"],"correct":3,"ru":"В тексте есть прямая фраза «Marco’s father, Juan». Уэйд и Томас — дети Марко.","kk":"Мәтінде «Marco’s father, Juan» деп тікелей айтылған. Уэйд пен Томас — Марконың балалары.","why":""},{"q":"In what year was Marco's dad serving as mayor?","options":["1989","1999","1987","None of these choices"],"correct":3,"ru":"Хуан был мэром с 1990 по 1998 год. Ни 1989, ни 1999, ни 1987 не входят в этот период, поэтому правильный ответ — «None of these choices».","kk":"Хуан 1990 жылдан 1998 жылға дейін мэр болған. 1989, 1999 және 1987 жылдары бұл аралыққа кірмейді, сондықтан «None of these choices» дұрыс.","why":""},{"q":"What is the name of Marco’s wife?","options":["Victoria","Emilia","Susan","Sandra"],"correct":3},{"q":"Which city was his father mayor of?","options":["Tallahassee","Miami","Jacksonville","Orlando"],"correct":1}],"transcript":"","translation":{"kk":"Марко Флорида штатындағы Джэксонвилл қаласында тұрады және саяси қызметке сайлауға түсуді ойлап жүр. Оның төрт баласы бар. Ол балаларының лайықты өмір сүруі үшін қызметке сайланғысы келеді. Сондай-ақ өз қауымдастығындағы барлық балалардың мүддесін қорғауды қалайды.\n\nАлайда Марко қай қызметке үміткер болатынын әлі білмейді. Оның әйелі Сандра Марконың сайлауға түскенін қаламайды. Ол күйеуі оның орнына қоғамға ерікті ретінде көбірек көмектесуі керек деп санайды. Сандраның ойынша, саясат көп уақыт алады да, Эмилия, Томас, Виктория және Уэйд есімді балалары әкесімен жеткілікті уақыт өткізе алмайды. Ал Марконың әкесі Хуан ұлының сайлауға түскенін қолдайды. Хуан 1990–1998 жылдары Майами қаласының мэрі болған.","ru":"Марко живёт в Джэксонвилле, штат Флорида, и думает о том, чтобы баллотироваться на государственную должность. У него четверо детей, и он хочет заняться политикой, чтобы обеспечить им достойную жизнь. Он также хочет защищать интересы всех детей в своём сообществе.\n\nОднако Марко пока не знает, на какую именно должность он хочет претендовать. Его жена Сандра не хочет, чтобы он баллотировался. Она считает, что вместо этого Марко стоит больше заниматься волонтёрской работой для местного сообщества. По её мнению, политика будет отнимать слишком много времени, и дети — Эмилия, Томас, Виктория и Уэйд — не смогут проводить достаточно времени с отцом. Но отец Марко, Хуан, поддерживает его решение. Хуан был мэром Майами с 1990 по 1998 год."},"words":[{"word":"run for office","syn":"stand for election","ru":"баллотироваться на должность","kk":"сайлауға түсу"},{"word":"ensure","syn":"make certain","ru":"обеспечить, гарантировать","kk":"қамтамасыз ету"},{"word":"deserve","syn":"be worthy of","ru":"заслуживать","kk":"лайық болу"},{"word":"advocate","syn":"supporter","ru":"защитник интересов","kk":"мүдде қорғаушысы"},{"word":"community","syn":"local population","ru":"местное сообщество","kk":"жергілікті қауымдастық"},{"word":"seek","syn":"pursue","ru":"добиваться, претендовать","kk":"ұмтылу, үміткер болу"},{"word":"volunteer","syn":"offer help","ru":"быть волонтёром","kk":"ерікті түрде көмектесу"},{"word":"instead","syn":"alternatively","ru":"вместо этого","kk":"оның орнына"},{"word":"take up time","syn":"consume time","ru":"отнимать время","kk":"уақыт алу"},{"word":"quality time","syn":"meaningful time together","ru":"время, проведённое с пользой","kk":"бірге өткізген сапалы уақыт"}],"durationSeconds":null,"supplemental":true,"limit":48},{"file":"en-starting-a-business-72.mp3","title":"Starting a Business","topic":"Политика и экономика","level":"B1","questions":[{"q":"When he started his business, how old was he?","options":["11","9","6","8"],"correct":1,"ru":"В первом предложении сказано, что он начал своё дело в девять лет.","kk":"Бірінші сөйлемде оның кәсібін тоғыз жасында бастағаны айтылған.","why":"The first sentence says he started his business at nine years old."},{"q":"What services did he provide with his business?","options":["Garden services","Car services","Food services","Education services"],"correct":0,"ru":"Он удалял сорняки, поливал цветы и убирал ветки во дворах — это садовые услуги.","kk":"Ол арамшөп жұлып, гүл суарып, ауладағы бұтақтарды жинады — бұлар бақша күтімі қызметтері.","why":"He removed weeds, watered flowers, and cleared branches from yards — all garden services."},{"q":"How much did the lawnmower cost?","options":["$100","$5 per hour","$25 per hour","20 hours"],"correct":0,"ru":"В тексте прямо указано, что газонокосилка стоила 100 долларов.","kk":"Мәтінде шөп шабатын машинаның бағасы 100 доллар болғаны нақты жазылған.","why":"The text explicitly states that the lawnmower cost $100."},{"q":"How did he feel about the lawnmower?","options":["He regretted buying it.","He wanted to take it to college.","He thought it was a good investment.","He threw it away."],"correct":2,"ru":"Он вернул потраченные 100 долларов после стрижки десяти газонов и назвал покупку хорошим вложением.","kk":"Ол он ауланың көгалын шауып, 100 долларын қайтарып алды және сатып алған затын жақсы инвестиция деп атады.","why":"He earned back the $100 after ten yards and calls the lawnmower a good investment."},{"q":"What did he study in college?","options":["Agriculture","History","Science","Landscaping"],"correct":3,"ru":"В третьем абзаце сказано, что он изучал ландшафтный дизайн в колледже.","kk":"Үшінші абзацта оның колледжде ландшафт дизайнын оқығаны айтылған.","why":"The third paragraph says he took college classes in landscaping."},{"q":"As an adult, how much did he charge for his services?","options":["$5 per hour","$25 per hour","$30 per hour","He didn’t charge anything"],"correct":1,"ru":"Он посчитал 30 долларов слишком высокой ценой и установил тариф 25 долларов в час.","kk":"Ол 30 долларды тым қымбат деп санап, сағатына 25 доллар алуды шешті.","why":"He considered $30 too expensive and settled on $25 per hour."},{"q":"How old was the narrator when starting a business?","options":["11","9","6","8"],"correct":1},{"q":"What services did the narrator provide?","options":["Garden services","Car services","Food services","Education services"],"correct":0}],"transcript":"I started my own business when I was nine years old. I plucked weeds, watered flowers and carried off sticks and branches from neighboring yards. I charged $5 per hour for my services.\n\nWhen I was a little older, I took some of my money and bought a lawnmower. It cost $100, so it was the same as 20 hours of work! However, I was able to charge $10 for mowing lawns, so I made my money back after mowing 10 yards. The lawnmower was a good investment.\n\nWhen I was an adult, I took college classes in landscaping. I learned a lot, and I improved my skills. Many customers wanted my services, so I thought about increasing my rates to $30 per hour, but I decided that was too expensive. I settled on $25 per hour.\n\nI think I'm doing a good job as a businessperson!","translation":{"kk":"Мен тоғыз жасымда өз кәсібімді бастадым. Көршілердің аулаларындағы арамшөптерді жұлып, гүлдерді суарып, бұтақтар мен таяқтарды жинадым. Қызметім үшін сағатына 5 доллар алдым.\n\nБіраз есейгенде жинаған ақшамның бір бөлігіне шөп шабатын машина сатып алдым. Оның бағасы 100 доллар болды, яғни 20 сағаттық еңбегіме тең еді! Бірақ көгал шапқаны үшін 10 доллар ала бастадым, сондықтан он ауланың шөбін шапқан соң жұмсаған ақшамды қайтарып алдым. Бұл жақсы инвестиция болды.\n\nЕресек болғанда колледжде ландшафт дизайны бойынша сабақтарға қатыстым. Көп нәрсе үйреніп, дағдыларымды жетілдірдім. Көптеген клиенттер менің қызметімді алғысы келді. Сондықтан бағамды сағатына 30 долларға көтеруді ойладым, бірақ оны тым қымбат деп шештім. Ақырында сағатына 25 доллар деп белгіледім.\n\nМен өз кәсібімді жақсы жүргізіп жүрмін деп ойлаймын!","ru":"Я начал собственное дело, когда мне было девять лет. Я вырывал сорняки, поливал цветы и убирал палки и ветки из соседских дворов. За свои услуги я брал 5 долларов в час.\n\nКогда я немного подрос, я потратил часть заработанных денег на газонокосилку. Она стоила 100 долларов — столько же, сколько я получал за 20 часов работы! Но за стрижку газонов я мог брать 10 долларов, поэтому окупил покупку после обработки десяти дворов. Газонокосилка оказалась хорошим вложением.\n\nКогда я стал взрослым, я изучал ландшафтный дизайн в колледже. Я многому научился и улучшил свои навыки. Многие клиенты хотели воспользоваться моими услугами, поэтому я подумал о повышении цены до 30 долларов в час, но решил, что это слишком дорого. В итоге я установил цену 25 долларов в час.\n\nДумаю, у меня хорошо получается вести бизнес!"},"words":[{"word":"start","syn":"begin","ru":"начинать","kk":"бастау"},{"word":"business","syn":"enterprise","ru":"бизнес, дело","kk":"кәсіп"},{"word":"pluck","syn":"pull out","ru":"вырывать","kk":"жұлу"},{"word":"charge","syn":"ask for payment","ru":"взимать плату","kk":"ақы алу"},{"word":"purchase","syn":"buy","ru":"покупать","kk":"сатып алу"},{"word":"investment","syn":"financial commitment","ru":"вложение","kk":"инвестиция"},{"word":"improve","syn":"develop","ru":"улучшать","kk":"жақсарту"},{"word":"customer","syn":"client","ru":"клиент","kk":"тұтынушы"},{"word":"increase","syn":"raise","ru":"повышать","kk":"арттыру"},{"word":"settle on","syn":"decide on","ru":"остановить выбор на","kk":"таңдау жасау"}],"durationSeconds":null,"supplemental":true,"limit":55},{"file":"en-the-challenges-and-rewards-of-volunteering-abroad-72.mp3","title":"The Challenges and Rewards of Volunteering Abroad","topic":"Общество и ценности","level":"B2","questions":[{"q":"What does volunteering mean?","options":["Giving time to help others","Purchasing company shares","Working exclusively for profit","Taking a compulsory examination"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What is one potential benefit of volunteering abroad?","options":["Learning about another culture","Avoiding all human contact","Never using new skills","Guaranteed high earnings"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What can make volunteering in another country challenging?","options":["Language differences","Having identical routines everywhere","Knowing every local custom already","Never meeting anyone new"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"Which quality is especially helpful when adapting to a new culture?","options":["Flexibility","Impatience","Indifference","Hostility"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What might volunteers develop through their experience?","options":["Communication skills","An airline license automatically","A guaranteed university degree","A permanent work visa automatically"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"Why is understanding local customs important?","options":["It helps people interact respectfully","It removes the need to communicate","It ensures everyone speaks one language","It prevents all cultural differences"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"Which activity is an example of volunteering?","options":["Helping at a community project","Buying goods for resale","Trading stocks for a salary","Attending a paid vacation tour"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What can be a rewarding outcome of volunteering abroad?","options":["Making a positive contribution","Avoiding any responsibility","Receiving guaranteed financial profit","Never facing unfamiliar situations"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."}],"transcript":"Last summer, I decided to spend four weeks volunteering in a rural village in another country. The experience began with uncertainty, as I worried about communicating in a new language and adapting to a completely different culture. Early on, I realized that everyday tasks, such as shopping for groceries or asking for directions, could be surprisingly difficult. One day, I spent nearly an hour trying to buy fruit in the local market, struggling to pronounce names and understand unfamiliar currency. Despite these challenges, the community was warm and eager to help, often inviting me to join family dinners and gently correcting my speaking mistakes.\n\nThe most rewarding part was teaching English to a group of eager, young students. Their curiosity and energy made each lesson lively, although my carefully planned activities sometimes turned into spontaneous games. Over the weeks, I learned to adapt on the fly and appreciate small moments of progress, like when a shy student volunteered to read aloud for the first time. Living and working so far from home forced me out of my comfort zone but also allowed me to build strong friendships with people who had once been strangers. The experience left me more confident in my language abilities and with a deeper understanding of daily life in a different part of the world.","translation":{"kk":"Өткен жазда мен басқа елдегі ауылда төрт апта ерікті болып жұмыс істеуді шештім. Бастапқыда жаңа тілде сөйлесу мен мүлде басқа мәдениетке бейімделу мені алаңдатты. Көп ұзамай азық-түлік сатып алу немесе жол сұрау сияқты күнделікті істердің өзі күтпеген жерден қиын болуы мүмкін екенін түсіндім. Бір күні жергілікті базардан жеміс сатып алуға бір сағатқа жуық уақыт жұмсадым: атауларды дұрыс айту және бейтаныс валютаны түсіну қиын болды. Осы қиындықтарға қарамастан, жергілікті тұрғындар жылы шырай танытып, көмектесуге дайын болды. Олар мені отбасылық кешкі асқа жиі шақырып, сөйлеу қателерімді сыпайы түрде түзететін.\n\nЕң қуаныштысы — ынталы жас оқушыларға ағылшын тілін үйрету болды. Олардың қызығушылығы мен жігері әр сабақты жандандыратын, ал алдын ала мұқият жоспарланған тапсырмалар кейде аяқасты ойындарға айналатын. Бірнеше апта ішінде мен жағдайға тез бейімделуді және шағын жетістіктерді бағалауды үйрендім. Мысалы, ұялшақ оқушының алғаш рет дауыстап оқуға өз еркімен шығуы ерекше есте қалды. Үйден алыс жерде өмір сүру және жұмыс істеу мені үйреншікті жайлылық аймағымнан шығарды, бірақ бұрын бейтаныс болған адамдармен берік достық орнатуға мүмкіндік берді. Бұл тәжірибе тілдік қабілеттеріме деген сенімді арттырып, әлемнің басқа бөлігіндегі күнделікті өмірді тереңірек түсінуге көмектесті.","ru":"Прошлым летом я решил провести четыре недели, работая волонтёром в сельской деревне в другой стране. Сначала я испытывал неуверенность: меня беспокоили общение на новом языке и необходимость привыкать к совершенно другой культуре. Вскоре я понял, что повседневные дела, например покупка продуктов или просьба объяснить дорогу, могут оказаться неожиданно сложными. Однажды я почти час пытался купить фрукты на местном рынке, с трудом произнося названия и разбираясь в незнакомой валюте. Несмотря на трудности, местные жители были приветливы и готовы помочь. Они часто приглашали меня на семейные ужины и мягко исправляли мои ошибки в речи.\n\nСамым приятным было преподавание английского группе любознательных молодых учеников. Их любопытство и энергия оживляли каждый урок, хотя тщательно подготовленные занятия иногда превращались в спонтанные игры. За эти недели я научился быстро приспосабливаться к обстоятельствам и ценить небольшие успехи — например, когда застенчивый ученик впервые вызвался читать вслух. Жизнь и работа вдали от дома заставили меня выйти из зоны комфорта, но также помогли завести крепкую дружбу с людьми, которые раньше были незнакомцами. Этот опыт придал мне уверенности в своих языковых навыках и помог глубже понять повседневную жизнь в другой части мира."},"words":[{"word":"uncertainty","syn":"doubt","ru":"неуверенность","kk":"сенімсіздік"},{"word":"adapt","syn":"adjust","ru":"приспосабливаться","kk":"бейімделу"},{"word":"unfamiliar","syn":"unknown","ru":"незнакомый","kk":"бейтаныс"},{"word":"eager","syn":"enthusiastic","ru":"стремящийся, увлечённый","kk":"ынталы"},{"word":"rewarding","syn":"fulfilling","ru":"приносящий удовлетворение","kk":"қанағат сыйлайтын"},{"word":"spontaneous","syn":"unplanned","ru":"спонтанный","kk":"аяқасты"},{"word":"progress","syn":"improvement","ru":"прогресс, улучшение","kk":"ілгерілеу"},{"word":"confident","syn":"self-assured","ru":"уверенный","kk":"өзіне сенімді"},{"word":"challenges","syn":"difficulties","ru":"трудности","kk":"қиындықтар"},{"word":"comfort zone","syn":"familiar environment","ru":"зона комфорта","kk":"жайлылық аймағы"}],"durationSeconds":null,"supplemental":true,"limit":88},{"file":"en-thomas-edison-69.mp3","title":"Thomas Edison","topic":"Промышленность и изобретения","level":"B1","questions":[{"q":"Thomas Edison graduated from which university?","options":["Yale","Harvard","None","Princeton"],"correct":2,"why":"The passage says he had very little formal schooling and dropped out of school."},{"q":"He built a laboratory in what city?","options":["Menlo Park, New Jersey","Cleveland, Ohio","Newark, New Jersey","Detroit, Michigan"],"correct":0,"why":"He eventually established a laboratory in Menlo Park, New Jersey."},{"q":"Edison had a disability. What was it?","options":["Partial blindness","Attention deficit hyperactivity disorder","Deafness","Paralysis"],"correct":2,"why":"His hearing loss became permanent."},{"q":"What was the machine that started him on the road to becoming an inventor?","options":["A light bulb","A motion picture projector","A record player","A telegraph"],"correct":3,"why":"The telegraph fascinated Edison and led him to improve its machinery."},{"q":"Edison got his first job working for:","options":["The US Army","The railroad","Western Union","A newspaper"],"correct":1,"why":"He left school to work for the railroad."},{"q":"Edison held over 1000 patents, including those for:","options":["The record player and the incandescent light bulb","The incandescent light bulb and the phonograph","The incandescent light bulb and the telephone","The phonograph and the telegraph"],"correct":1,"why":"The passage identifies the phonograph and incandescent light bulb as his inventions."},{"q":"Which method did Edison use when experimenting?","options":["Trial and error","Mathematical simulation","Random selection of assistants","Survey research"],"correct":0,"why":"He tried another approach whenever one did not work."},{"q":"What did the incandescent light bulb help develop?","options":["Electric lighting around the world","Steam-powered railways","Wireless radio networks","Paper-based telegraphy"],"correct":0,"why":"The text connects the bulb with the spread of electric lighting worldwide."}],"transcript":"Possibly the most famous American inventor, Thomas Edison set a world record by holding 1093 patents. Born in 1847 in Ohio, he was the youngest of seven children, only four of whom survived to become adults. In early childhood, Thomas developed hearing loss, which became permanent. His hearing difficulties later influenced his work as an inventor.\n\nHe had very little formal schooling because his deafness interfered. But he read everything he could get his hands on. He dropped out of school, going to work for the railroad. He became fascinated by the telegraph, which at the time transmitted by marking dots and dashes on paper. When telegraphers had to be able to hear, he turned to improving the machines and was able to add a printer. He then became an inventor full time, eventually setting up a laboratory in Menlo Park, New Jersey.\n\nBecause he was self-educated, Edison approached experimentation differently than did scientists. He used the trial and error method. If one thing didn't work, he tried another. In this manner he first invented the phonograph, which evolved into the record player, and the incandescent light bulb. The light bulb led to the development of electric lighting throughout the world.\n\nEdison was brilliant, but a difficult man to work with and often neglected his family. He died in 1931 of diabetes.","translation":{"kk":"Америкалық ең танымал өнертапқыштардың бірі Томас Эдисон 1093 патент алып, әлемдік рекорд орнатты. Ол 1847 жылы Огайо штатында жеті баланың кенжесі болып дүниеге келді; олардың төртеуі ғана ересек жасқа жетті. Бала кезінде оның есту қабілеті нашарлап, бұл жағдай тұрақты болып қалды. Естуіндегі қиындықтар кейін өнертапқыштық жұмысына әсер етті.\n\nЕсту қабілетінің нашарлығына байланысты Эдисон мектепте көп оқымады. Бірақ қолына түскеннің бәрін оқыды. Мектептен шығып, теміржолда жұмыс істеді. Ол қағазға нүктелер мен сызықшалар түсіретін телеграфқа қызықты. Телеграфшылардың жақсы естуі қажет болғандықтан, ол құрылғыларды жетілдіріп, оларға басып шығаратын тетік қосты. Кейін өнертапқыштықпен толық айналысып, Нью-Джерсидегі Менло-Паркте зертхана ашты.\n\nӨздігінен білім алған Эдисон тәжірибеге ғалымдардан өзгеше қарады: сынақ пен қателік әдісін қолданды. Бір тәсіл іске аспаса, басқасын байқап көрді. Осылайша ол фонографты және қыздыру шамын ойлап тапты. Шам бүкіл әлемде электр жарығының дамуына жол ашты.\n\nЭдисон дарынды болғанымен, онымен жұмыс істеу қиын еді және ол отбасына жиі көңіл бөлмеді. 1931 жылы диабеттен қайтыс болды.","ru":"Один из самых известных американских изобретателей, Томас Эдисон установил мировой рекорд, получив 1093 патента. Он родился в 1847 году в Огайо и был младшим из семи детей, из которых лишь четверо дожили до взрослого возраста. В раннем детстве у Томаса ухудшился слух, и потеря слуха стала постоянной. Позже это повлияло на его работу изобретателя.\n\nИз-за проблем со слухом Эдисон получил очень мало школьного образования, но читал всё, что мог найти. Он бросил школу и начал работать на железной дороге. Его заинтересовал телеграф, который тогда передавал сообщения с помощью точек и тире на бумаге. Когда телеграфистам стало необходимо хорошо слышать, Эдисон занялся усовершенствованием аппаратов и добавил печатающее устройство. Позже он полностью посвятил себя изобретательству и создал лабораторию в Менло-Парке, штат Нью-Джерси.\n\nБудучи самоучкой, Эдисон экспериментировал иначе, чем учёные. Он использовал метод проб и ошибок: если что-то не работало, пробовал другой способ. Так он создал фонограф, предшественник проигрывателя, и лампу накаливания. Лампа способствовала распространению электрического освещения по всему миру.\n\nЭдисон был блестящим изобретателем, но сложным человеком в работе и часто уделял мало внимания семье. Он умер от диабета в 1931 году."},"words":[{"word":"inventor","syn":"—","kk":"өнертапқыш","ru":"изобретатель"},{"word":"patent","syn":"legal right to an invention","kk":"патент","ru":"патент"},{"word":"hearing loss","syn":"reduced ability to hear","kk":"есту қабілетінің төмендеуі","ru":"потеря слуха"},{"word":"permanent","syn":"—","kk":"тұрақты","ru":"постоянный"},{"word":"formal schooling","syn":"—","kk":"мектептегі ресми білім","ru":"школьное образование"},{"word":"railroad","syn":"railway","kk":"теміржол","ru":"железная дорога"},{"word":"telegraph","syn":"—","kk":"телеграф","ru":"телеграф"},{"word":"dots and dashes","syn":"—","kk":"нүктелер мен сызықшалар","ru":"точки и тире"},{"word":"laboratory","syn":"research facility","kk":"зертхана","ru":"лаборатория"},{"word":"self-educated","syn":"—","kk":"өздігінен білім алған","ru":"самоучка"},{"word":"trial and error","syn":"—","kk":"сынақ пен қателік","ru":"метод проб и ошибок"},{"word":"phonograph","syn":"early sound recorder","kk":"фонограф","ru":"фонограф"},{"word":"incandescent light bulb","syn":"—","kk":"қыздыру шамы","ru":"лампа накаливания"},{"word":"neglected","syn":"—","kk":"көңіл бөлмеді","ru":"пренебрегал"}],"durationSeconds":null,"limit":null},{"file":"english-history-of-chocolate-QMY9ukSoCvk.mp3","title":"History of Chocolate","topic":"Промышленность и изобретения","level":"B1","questions":[{"q":"Where do cocoa beans come from?","options":["Cacao trees","Cocoa trees","Maize","Coffee"],"correct":1},{"q":"Which civilization first used cocoa beans according to the passage?","options":["Mayan","Olmec","Aztec","Inca"],"correct":1},{"q":"Which use was NOT described?","options":["Celebrations","Transactions","Birth and hygiene","Rites of passage"],"correct":2},{"q":"Where are cacao trees native to?","options":["Europe","Asia","Central and South America","Antarctica"],"correct":2},{"q":"What did the Olmec possibly use cocoa beans for?","options":["Currency","Ceremonial drinks","Transactions","Trade"],"correct":1},{"q":"Is there sufficient historical evidence of this Olmec use?","options":["No","Yes","Yes, historians proved it","Yes, ancient drawings prove it"],"correct":0},{"q":"What plant is used to make chocolate?","options":["Cacao","Coffee","Tea","Vanilla orchid"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"Which part of the cacao plant is processed into chocolate?","options":["Seeds (beans)","Leaves","Roots","Flowers"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."}],"transcript":"Chocolate has always been one of America's favorite treats, but did you know that Americans were not the first to consume it? We can thank ancient civilizations such as the Olmecs and Mayans for the discovery and invention of cocoa bean products.\n\nCocoa beans are derived from fruits of cacao trees, plants native to Central and South America. It is commonly thought that the Olmec civilization used cocoa beans in the creation of ceremonial drinks, however, there has not been sufficient evidence to prove that.\n\nThis knowledge of chocolate was passed to the Mayans who not only used but revered it. Historical evidence has shown that chocolate was used in grand celebrations and to finalize important transactions in Mayan culture. Over its life span, chocolate has been used as a stimulant, treat, form of currency, rite of passage, and now delicacy that we all know and love.","translation":{"kk":"Шоколад әрқашан америкалықтардың сүйікті тәттілерінің бірі болған. Бірақ оны алғаш тұтынған америкалықтар емес екенін білесіз бе? Какао бұршақтарынан жасалатын өнімдердің ашылуы мен пайда болуына ольмектер мен майялар сияқты ежелгі өркениеттер үлес қосты.\n\nКакао бұршақтары Орталық және Оңтүстік Америкада өсетін какао ағашының жемістерінен алынады. Ольмек өркениеті какао бұршақтарын салтанатты сусындар жасауға пайдаланған деген пікір кең таралған, алайда мұны растайтын жеткілікті дәлел жоқ.\n\nШоколад туралы білім майяларға жетті. Олар оны пайдаланып қана қоймай, жоғары бағалады. Тарихи деректер майя мәдениетінде шоколадтың үлкен мерекелерде және маңызды мәмілелерді аяқтау кезінде қолданылғанын көрсетеді. Тарих бойы шоколад сергіткіш, тәтті тағам, ақша түрі, салт-жораның бөлігі және бүгінгі сүйікті дәмді тағамымыз болды.","ru":"Шоколад всегда был одним из любимых лакомств американцев, но знаете ли вы, что американцы не были первыми, кто его употреблял? За открытие и создание продуктов из какао-бобов мы можем благодарить древние цивилизации, такие как ольмеки и майя.\n\nКакао-бобы получают из плодов какао-деревьев, произрастающих в Центральной и Южной Америке. Принято считать, что ольмеки использовали какао-бобы для приготовления церемониальных напитков, однако достаточных доказательств этого нет.\n\nЗнания о шоколаде передались майя, которые не просто использовали его, но и высоко ценили. Исторические свидетельства показывают, что шоколад применяли на крупных праздниках и при заключении важных сделок в культуре майя. За свою историю шоколад был стимулятором, угощением, формой денег, частью обрядов перехода и, наконец, любимым нами деликатесом."},"words":[{"word":"consume","syn":"use up","ru":"потреблять","kk":"тұтыну"},{"word":"ancient","syn":"old","ru":"древний","kk":"ежелгі"},{"word":"civilization","syn":"society","ru":"цивилизация","kk":"өркениет"},{"word":"derived","syn":"obtained","ru":"полученный","kk":"алынған"},{"word":"native","syn":"indigenous","ru":"местный, коренной","kk":"жергілікті"},{"word":"ceremonial","syn":"ritual","ru":"церемониальный","kk":"салтанатты"},{"word":"sufficient","syn":"enough","ru":"достаточный","kk":"жеткілікті"},{"word":"evidence","syn":"proof","ru":"доказательство","kk":"дәлел"},{"word":"revered","syn":"respected","ru":"почитаемый","kk":"құрметтелген"},{"word":"transactions","syn":"deals","ru":"сделки","kk":"мәмілелер"},{"word":"delicacy","syn":"treat","ru":"деликатес","kk":"таңсық тағам"}],"durationSeconds":null,"supplemental":true,"limit":79}];const UI={"ru": {"heading": "Listening 3 · Тематические аудиоуроки", "subtitle": "Аудирование · вопросы · объяснения · переводы · синонимы", "listen": "Прослушайте аудио", "mode": "Режим выполнения", "quiz": "Quiz: объяснение сразу после ответа.", "test": "Test: проверка после завершения.", "finish": "Показать результат", "reset": "Начать заново", "translation": "Перевод", "synonyms": "Synonyms", "unanswered": "Ответьте на все 8 вопросов.", "correct": "Верно!", "wrong": "Неверно.", "answer": "Правильный ответ:", "result": "Результат", "missing": "Материал для этого урока ещё не добавлен."}, "kk": {"heading": "Listening 3 · Тақырыптық аудиосабақтар", "subtitle": "Тыңдалым · сұрақтар · түсіндірмелер · аудармалар · синонимдер", "listen": "Аудионы тыңдаңыз", "mode": "Тапсырма режимі", "quiz": "Quiz: әр жауаптан кейін түсіндірме шығады.", "test": "Test: соңында тексеріледі.", "finish": "Нәтижені көрсету", "reset": "Қайта бастау", "translation": "Аударма", "synonyms": "Synonyms", "unanswered": "Барлық 8 сұраққа жауап беріңіз.", "correct": "Дұрыс!", "wrong": "Қате.", "answer": "Дұрыс жауап:", "result": "Нәтиже", "missing": "Бұл сабақтың материалы әлі қосылмаған."}};let lang='kk';const states=lessons.map(l=>({mode:'quiz',answers:Array(l.questions.length).fill(null),done:false,tab:'questions'}));function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function setLang(x){lang=x;document.documentElement.lang=x;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.id===x));render()}function changeTab(i,t){states[i].tab=t;render()}function changeMode(i,m){states[i]={mode:m,answers:Array(lessons[i].questions.length).fill(null),done:false,tab:'questions'};render()}function choose(i,j,k){let s=states[i];if(s.done||(s.mode==='quiz'&&s.answers[j]!==null))return;s.answers[j]=k;if(s.mode==='quiz'&&s.answers.every(x=>x!==null))s.done=true;render()}function finish(i){let s=states[i];if(s.answers.some(x=>x===null)){document.getElementById('result'+i).textContent=UI[lang].unanswered;return}s.done=true;render()}function reset(i){states[i]={mode:states[i].mode,answers:Array(lessons[i].questions.length).fill(null),done:false,tab:'questions'};render()}let visibleCount=3;function showMore(){visibleCount=Math.min(lessons.length,visibleCount+3);render()}function render(){let t=UI[lang];document.getElementById('heading').textContent=t.heading;document.getElementById('subtitle').textContent=t.subtitle;const holder=document.getElementById('lessons');let audios=[...holder.querySelectorAll('audio')];audios.forEach(a=>a.remove());holder.innerHTML=lessons.slice(0,visibleCount).map((l,i)=>{let s=states[i],q=l.questions||[],score=q.filter((x,j)=>s.answers[j]===x.correct).length;return `<article class="card lesson-card" id="lesson${i+1}"><div class="head"><div class="kicker">LISTENING ${String(i+1).padStart(2,'0')} · ${E(l.level||'B1')} · ${l.limit?fmt(l.limit):'MP3'}</div><h2>${E(l.title)}</h2><p class="source">${E(l.topic||'English Listening')}</p></div><div class="content"><div class="player"><strong>${t.listen}</strong><div class="audio-time">${l.limit?'00:00–'+fmt(l.limit):''}</div><audio data-file="${E(l.file)}" data-limit="${l.limit||0}" controls preload="metadata" src="${E(l.file)}"></audio></div><nav class="tabs">${[['questions','Test'],['transcript','Transcript'],['translation',t.translation],['synonyms',t.synonyms]].map(([id,label])=>`<button class="tab ${s.tab===id?'active':''}" onclick="changeTab(${i},'${id}')">${label}</button>`).join('')}</nav>${s.tab==='questions'?`<strong>${t.mode}</strong><div class="modes"><button class="btn ${s.mode==='quiz'?'active':''}" onclick="changeMode(${i},'quiz')">Quiz</button><button class="btn ${s.mode==='test'?'active':''}" onclick="changeMode(${i},'test')">Test</button></div><p class="muted">${t[s.mode]}</p>${q.map((x,j)=>`<div class="question"><h4>${j+1}. ${E(x.q)}</h4>${x.options.map((o,k)=>`<label class="option"><input type="radio" name="q${i}_${j}" ${s.answers[j]===k?'checked':''} ${(s.done||(s.mode==='quiz'&&s.answers[j]!==null))?'disabled':''} onchange="choose(${i},${j},${k})"><span>${'ABCDE'[k]}. ${E(o)}</span></label>`).join('')}${(s.done||(s.mode==='quiz'&&s.answers[j]!==null))?`<div class="feedback ${s.answers[j]===x.correct?'good':''}"><b>${s.answers[j]===x.correct?t.correct:t.wrong}</b><p>${t.answer} ${'ABCDE'[x.correct]}. ${E(x.options[x.correct])}</p><p>${E(x[lang]||x.why||'')}</p></div>`:''}</div>`).join('')}<button class="btn primary" onclick="finish(${i})">${t.finish}</button> <button class="btn" onclick="reset(${i})">${t.reset}</button><div id="result${i}">${s.done?`<div class="result">${t.result}: <strong>${score} / ${q.length}</strong> · ${Math.round(score/q.length*100)}%</div>`:''}</div>`:s.tab==='transcript'?`<div class="reading">${E(l.transcript||t.missing)}</div>`:s.tab==='translation'?`<div class="reading">${E((l.translation||{})[lang]||t.missing)}</div>`:`<div class="reading">${(l.words||[]).length?l.words.map(w=>`<div class="synrow"><b>${E(w.word)}</b> — ${E(w.syn)}<div>${E(w[lang])}</div></div>`).join(''):t.missing}</div>`}</div></article>`}).join('')+(visibleCount<lessons.length?`<div style="text-align:center;margin:24px 0"><button class="btn primary" onclick="showMore()">${lang==='kk'?'Келесі сабақтарды көрсету':'Показать следующие уроки'} (${visibleCount}/${lessons.length})</button></div>`:'');holder.querySelectorAll('audio').forEach(a=>{let old=audios.find(x=>x.dataset.file===a.dataset.file);if(old){a.replaceWith(old);a=old}let limit=Number(a.dataset.limit);if(limit&&!a.dataset.bound){a.dataset.bound='1';let stop=()=>{if(a.currentTime>=limit){a.pause();a.currentTime=limit}};a.addEventListener('timeupdate',stop);a.addEventListener('seeking',stop);a.addEventListener('play',stop)}})}try{render()}catch(e){document.getElementById('lessons').innerHTML='<p style="padding:20px;color:#b91c1c">Ошибка загрузки уроков: '+String(e.message)+'</p>';console.error(e)}</script></body></html>
