<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGIST PRO — Listening 3</title><style>
:root{--p:#5147ed;--ink:#19243d;--muted:#68738b;--line:#e2e6f2}*{box-sizing:border-box}body{margin:0;background:#fafbff;color:var(--ink);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:15px max(18px,calc((100% - 1020px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.brand span{color:var(--p)}.langs{display:flex;background:#f0efff;padding:4px;border-radius:22px}.langs button{border:0;border-radius:20px;background:transparent;padding:8px 15px;font-weight:800;cursor:pointer}.langs .active{background:var(--p);color:white}main{max-width:1020px;margin:30px auto 80px;padding:0 18px}.kicker{font-size:12px;font-weight:850;letter-spacing:.1em;color:var(--p)}h1{font-size:clamp(26px,4vw,38px);margin:8px 0}h2{font-size:27px;margin:8px 0}.subtitle,.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 10px 36px #2330560a}.head{padding:25px 26px 8px}.content{padding:16px 26px 30px}.player{background:#f6f7ff;border:1px solid var(--line);border-radius:14px;padding:17px 20px;margin-bottom:20px}audio{display:block;width:100%;margin-top:12px}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:20px}.tab,.btn{border:1px solid var(--line);border-radius:11px;padding:12px 7px;background:white;color:var(--ink);font-weight:800;cursor:pointer}.tab.active,.btn.primary{background:var(--p);border-color:var(--p);color:white}.panel[hidden]{display:none}.modes{display:flex;gap:8px;margin:12px 0}.btn.active{background:#efedff;color:var(--p);border-color:#bbb5ff}.question{border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.question h4{margin:0 0 12px}.option{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:9px;background:#f9faff;padding:10px 12px;margin:7px 0;cursor:pointer}.option:has(input:checked){background:#f1f0ff;border-color:var(--p)}input{accent-color:var(--p);margin-top:5px}.feedback{padding:12px;border-radius:10px;margin-top:10px;background:#fff0eb}.feedback.good{background:#e8f8ed}.result{background:#f0efff;border:1px solid #c9c4ff;border-radius:14px;padding:18px;margin-top:18px;font-weight:800}.result strong{color:var(--p);font-size:24px}.reading{white-space:pre-line;background:#fafbff;border:1px solid var(--line);padding:20px;border-radius:12px;line-height:1.85}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left}.source{font-size:12px;color:var(--muted)}@media(max-width:600px){.head,.content{padding-left:15px;padding-right:15px}.tab{font-size:11px;padding:10px 2px}.question{padding:12px}}

.lesson-card{margin-top:24px}.synrow{border-bottom:1px solid var(--line);padding:10px 0}.feedback p{margin:5px 0}.head .kicker{margin-bottom:6px}.audio-time{font-size:13px;color:var(--muted)}</style></head><body><header><div class="brand">MAGIST <span>PRO</span></div><div class="langs"><button id="kk" class="active" onclick="setLang('kk')">ҚАЗ</button><button id="ru" onclick="setLang('ru')">РУС</button></div></header><main><div class="kicker">ENGLISH · LISTENING · PART 3</div><h1 id="heading"></h1><p id="subtitle" class="subtitle"></p><div id="lessons"></div></main><script>const lessons=[{"file":"en-a-family-vacation-72.mp3","title":"A Family Vacation","topic":"Традиции и праздники","level":"B1","questions":[{"q":"Where is Jenny going?","options":["Bermuda","the Bahamas","the Caribbean Islands","Disneyland"],"correct":1,"ru":"В первом предложении прямо сказано, что Дженни едет в круиз на Багамские острова.","kk":"Бірінші сөйлемде Дженнидің Багам аралдарына круизге баратыны нақты айтылған.","why":""},{"q":"How is Jenny getting there?","options":["Cruise ship","Driving","Taking a flight","None of the above"],"correct":0,"ru":"Семья поднимается на борт круизного лайнера, поэтому верный вариант — cruise ship.","kk":"Отбасы круиздік кемеге мінеді, сондықтан дұрыс жауап — cruise ship.","why":""},{"q":"According to the passage and using your skills of inference, where do Jenny and her parents live?","options":["New Hampshire","New York","Florida","Texas"],"correct":1,"ru":"Отец радуется возможности уехать от холодной погоды Нью-Йорка. Из этого можно сделать вывод, что семья живёт там.","kk":"Әкесі Нью-Йорктің суық ауа райынан кеткеніне қуанады. Осыдан отбасы сол жерде тұрады деп тұжырымдауға болады.","why":""},{"q":"What type of dress did Jenny wear to have her passport picture taken?","options":["Striped","Purple","Plaid","Polka-dotted"],"correct":3,"ru":"В тексте указано, что для фотографии на паспорт Дженни надела платье в горошек — polka-dotted dress.","kk":"Мәтінде Дженни төлқұжат суретіне бұршақ өрнекті көйлек — polka-dotted dress кигені жазылған.","why":""},{"q":"What color is Jenny’s suitcase?","options":["Blue","Pink","Purple","Yellow"],"correct":1,"ru":"Сотрудница у стойки хвалит её pink suitcase — розовый чемодан.","kk":"Тіркеу қызметкері оның pink suitcase — қызғылт чемоданын мақтайды.","why":""},{"q":"What does Jenny stare at as she enters the cruise ship?","options":["The ocean","A chandelier","A painting","None of the above"],"correct":1,"ru":"При регистрации Дженни с восхищением смотрит на стеклянную люстру, висящую над головой.","kk":"Тіркеу кезінде Дженни төбеде ілулі тұрған шыны аспашамға таңдана қарайды.","why":""},{"q":"Where do Jenny and her parents live?","options":["New Hampshire","New York","Florida","Texas"],"correct":1},{"q":"What kind of dress did Jenny wear for her passport photo?","options":["Striped","Purple","Plaid","Polka-dotted"],"correct":3}],"transcript":"Jenny is going on a cruise to the Bahamas with her family over Christmas break.\n\n\"It's such a relief to be away from the cold weather of New York,\" Jenny's father remarks as they step onboard the cruise ship.\n\nJenny agrees and her eyes dart around everywhere excitedly. She has never been on a boat, much less a ship this huge before. Her parents let her hold onto her documents and passport as they arrive at the desk to check-in. She has recently had her passport picture taken and hopes that the adults at the desk like her picture. She had worn her best polka-dotted dress for the photo session but had not realized that her clothing would not be shown in the picture.\n\nAs they arrive at the desk, she stares in awe at the beautiful glass chandelier hanging above. The kind lady at the counter compliments Jenny on her pink suitcase and at that moment, she knows that this trip will be one to remember.","translation":{"kk":"Дженни Рождество демалысында отбасымен бірге Багам аралдарына круизге аттанады.\n\n«Нью-Йорктің суық ауа райынан алыстаған қандай жақсы», — дейді Дженнидің әкесі круиздік кемеге мінген кезде.\n\nДженни келісіп, айналасына қуана көз жүгіртеді. Ол бұрын тіпті қайыққа мініп көрмеген, ал мұндай үлкен кемеге алғаш рет келіп тұр. Тіркеу үстеліне жақындағанда ата-анасы оған құжаттары мен төлқұжатын өзіне ұстатады. Жақында ол төлқұжатқа суретке түскен еді, енді қызметкерлерге суреті ұнайды деп үміттенеді. Суретке түсу үшін ең әдемі бұршақ өрнекті көйлегін киген, бірақ фотода киімі көрінбейтінін білмеген.\n\nТіркеу орнына келгенде, ол төбеде ілулі тұрған әдемі шыны аспашамға таңдана қарайды. Қызметкер әйел Дженнидің қызғылт чемоданын мақтайды. Сол сәтте Дженни бұл сапардың ұмытылмас болатынын түсінеді.","ru":"Дженни отправляется с семьёй в круиз на Багамские острова во время рождественских каникул.\n\n«Какое облегчение уехать от холодной погоды Нью-Йорка», — замечает отец Дженни, когда они поднимаются на борт круизного лайнера.\n\nДженни соглашается и взволнованно оглядывается вокруг. Она никогда раньше не была даже на лодке, не говоря уже о таком огромном корабле. Родители разрешают ей самой держать документы и паспорт, пока они подходят к стойке регистрации. Недавно она сфотографировалась на паспорт и надеется, что сотрудникам понравится её фотография. Для съёмки она надела своё лучшее платье в горошек, но не знала, что одежда не будет видна на фотографии.\n\nПодойдя к стойке, она с восхищением смотрит на красивую стеклянную люстру над головой. Добрая сотрудница хвалит розовый чемодан Дженни, и в этот момент девочка понимает, что эта поездка запомнится надолго."},"words":[{"word":"cruise","syn":"sea voyage","ru":"круиз, морское путешествие","kk":"круиз, теңіз саяхаты"},{"word":"relief","syn":"comfort","ru":"облегчение, утешение","kk":"жеңілдік, жұбаныш"},{"word":"remark","syn":"comment","ru":"заметить, прокомментировать","kk":"атап өту, пікір айту"},{"word":"excitedly","syn":"enthusiastically","ru":"взволнованно, с энтузиазмом","kk":"қуана, ынтамен"},{"word":"huge","syn":"enormous","ru":"огромный, громадный","kk":"өте үлкен, алып"},{"word":"documents","syn":"papers","ru":"документы, бумаги","kk":"құжаттар, қағаздар"},{"word":"polka-dotted","syn":"spotted","ru":"в горошек, пятнистый","kk":"бұршақ өрнекті, дақты"},{"word":"stare in awe","syn":"gaze in wonder","ru":"смотреть с восхищением","kk":"таңдана қарау"},{"word":"compliment","syn":"praise","ru":"делать комплимент, хвалить","kk":"мақтау, қошеметтеу"},{"word":"memorable","syn":"unforgettable","ru":"запоминающийся, незабываемый","kk":"есте қаларлық, ұмытылмас"}],"durationSeconds":58,"supplemental":true,"limit":58},{"file":"en-a-sequence-in-software-development-72.mp3","title":"A Sequence in Software Development","topic":"Наука и технологии","level":"B2","questions":[{"q":"What kind of role does Lindsey have?","options":["A software engineer","A software developer","A project manager","A user acceptance tester"],"correct":1,"why":"Lindsey is described as a software developer."},{"q":"Why does Lindsey work in her basement?","options":["It is comfortable","It is dark and reduces eye strain","It is quiet from the rest of her family","It has optimal heating conditions"],"correct":2,"why":"The passage says the basement is quiet from the rest of her family."},{"q":"What does Lindsey do in her role?","options":["She creates applications and manages the code for each","She manages a team that makes apps","She performs user acceptance tests","She provides customer support services"],"correct":0,"why":"She creates applications and manages the code for each one."},{"q":"Which activity is NOT mentioned as a check Lindsey performs?","options":["Checking spacing","Checking naming conventions","Testing commands","Publishing her program on the internet"],"correct":3,"why":"The text mentions spacing, naming conventions and testing commands, but not publishing online."},{"q":"How does Lindsey tell a computer what to do?","options":["She reads a book","She writes commands","She reads an essay","She presses buttons"],"correct":1,"why":"She writes commands that tell a computer what to do."},{"q":"Which type of apps is NOT mentioned among requests?","options":["Games","Business apps","Utility apps","Web apps"],"correct":3,"why":"The passage lists business apps, games and utility apps, not web apps."},{"q":"What can Lindsey do to let others use her programs?","options":["Ask them","Give them a reward","Charge them","Pay them"],"correct":2,"why":"She can charge people for using her programs."},{"q":"What can people request Lindsey to add?","options":["Security updates","New features","Bug fixes","New apps"],"correct":1,"why":"The passage specifically says people can request new features."}],"transcript":"Lindsey is a software developer who lives in a house that is only 12 feet tall. She works in her basement where it is quiet from the rest of her family.\n\nAs a software developer, Lindsey creates applications and manages the code for each. She writes commands that tell a computer what to do. To make sure her programs work, she checks her spacing, checks the naming conventions that she uses and tests her commands.\n\nLindsey can give her programs to other people. People only ask for business apps, games or utility apps. She can charge people for using her programs, and other people can request new features. If she is able to, then she adds them to her programs.","translation":{"kk":"Линдси — бағдарламалық жасақтама әзірлеушісі. Ол биіктігі небәрі 12 фут болатын үйде тұрады. Ол отбасының басқа мүшелерінен бөлек, тыныш жертөледе жұмыс істейді.\n\nБағдарламашы ретінде Линдси қолданбалар жасап, әрқайсысының кодын басқарады. Ол компьютерге не істеу керегін түсіндіретін командалар жазады. Бағдарламаларының дұрыс жұмыс істейтініне көз жеткізу үшін бос орындарды, атау беру ережелерін және командаларын тексереді.\n\nЛиндси бағдарламаларын басқа адамдарға ұсына алады. Адамдар одан бизнеске арналған қолданбаларды, ойындарды немесе пайдалы қызметтік қолданбаларды сұрайды. Ол бағдарламаларын пайдаланғаны үшін ақы ала алады. Сондай-ақ адамдар жаңа мүмкіндіктерді сұрай алады; мүмкіндігі болса, Линдси оларды бағдарламаларына қосады.","ru":"Линдси — разработчик программного обеспечения. Она живёт в доме высотой всего 12 футов. Она работает в подвале, где тихо и её не отвлекают остальные члены семьи.\n\nКак разработчик Линдси создаёт приложения и управляет кодом каждого из них. Она пишет команды, которые указывают компьютеру, что делать. Чтобы убедиться, что программы работают, она проверяет пробелы, правила именования и тестирует свои команды.\n\nЛиндси может предоставлять свои программы другим людям. Люди обращаются к ней за бизнес-приложениями, играми и служебными приложениями. Она может брать плату за использование программ. Пользователи также могут просить добавить новые функции, и, если это возможно, Линдси добавляет их."},"words":[{"word":"software developer","syn":"—","kk":"бағдарламалық жасақтама әзірлеушісі","ru":"разработчик программного обеспечения"},{"word":"basement","syn":"—","kk":"жертөле","ru":"подвал"},{"word":"application","syn":"—","kk":"қолданба","ru":"приложение"},{"word":"manage code","syn":"—","kk":"кодты басқару","ru":"управлять кодом"},{"word":"command","syn":"—","kk":"команда","ru":"команда"},{"word":"spacing","syn":"—","kk":"бос орындар","ru":"пробелы"},{"word":"naming conventions","syn":"—","kk":"атау беру ережелері","ru":"правила именования"},{"word":"test","syn":"—","kk":"тексеру","ru":"тестировать"},{"word":"utility app","syn":"—","kk":"қызметтік қолданба","ru":"служебное приложение"},{"word":"charge","syn":"—","kk":"ақы алу","ru":"взимать плату"},{"word":"request","syn":"—","kk":"сұрау","ru":"запрашивать"},{"word":"new features","syn":"—","kk":"жаңа мүмкіндіктер","ru":"новые функции"}],"durationSeconds":null,"limit":null},{"file":"en-a-surprising-new-years-eve-snowfall-72.mp3","title":"A Surprising New Year's Eve Snowfall","topic":"Традиции и праздники","level":"B1","questions":[{"q":"What holiday were they preparing to celebrate?","options":["Thanksgiving Day","New Year's Eve","Halloween night","Independence Day"],"correct":1,"ru":"В тексте сказано, что друзья готовились встретить канун Нового года — New Year's Eve.","kk":"Мәтінде достардың Жаңа жыл қарсаңын (New Year's Eve) тойлауға дайындалғаны айтылған."},{"q":"What did the weather report say before the party?","options":["It would be rainy and stormy","It would bring heavy snow","It would be cold with no snow","It would be warm and sunny"],"correct":2,"ru":"Прогноз обещал холод, но о снеге не упоминалось.","kk":"Ауа райы болжамы күн суық болатынын айтты, бірақ қар туралы айтылмады."},{"q":"About how many people were invited?","options":["About fifty people were invited","About fifteen people were invited","About thirty people were invited","About five people were invited"],"correct":1,"ru":"Автор прямо говорит: «About fifteen people were invited» — около пятнадцати человек.","kk":"Автор «About fifteen people were invited» дейді, яғни шамамен он бес адам шақырылған."},{"q":"What unexpected weather event happened during setup?","options":["A sudden rain shower started","Snowflakes began to fall","Strong winds kicked up dust","Hail pellets began to fall"],"correct":1,"ru":"Когда они расставляли стулья, с неба начали падать белые снежинки.","kk":"Орындықтарды орналастырып жатқанда аспаннан ақ қар ұлпалары түсе бастады."},{"q":"What did people do when the snowfall grew heavier?","options":["They rushed outside to take photos","They drove to a nearby ski resort","They stayed inside to watch TV","They went downtown to see a parade"],"correct":0,"ru":"Друзья выбежали на улицу с телефонами и стали фотографировать снег.","kk":"Достар телефондарын алып, қарды суретке түсіру үшін сыртқа жүгіріп шықты."},{"q":"What did they use to sled down the small hill?","options":["Wooden boards","Plastic trays","Pots and pans","Cardboard boxes"],"correct":2,"ru":"Для катания с горки они использовали кастрюли и сковородки — pots and pans.","kk":"Төбеден сырғанау үшін кәстрөлдер мен табаларды — pots and pans — пайдаланған."},{"q":"What did they drink afterward to warm up?","options":["They served iced lemonade outside","They brewed cold coffee outside","They drank hot chocolate inside","They poured chilled sodas outside"],"correct":2,"ru":"Позже они зашли домой и выпили горячий шоколад, чтобы согреться.","kk":"Кейін жылыну үшін үйге кіріп, ыстық шоколад ішкен."},{"q":"What did the snowy scene remind one friend of?","options":["Summer festivals by the seaside","Autumn fairs in his hometown","Winter holidays in his home country","Spring celebrations in the desert"],"correct":2,"ru":"Друг сказал, что снежная картина напомнила ему зимние праздники в родной стране.","kk":"Бір досы қарлы көрініс туған еліндегі қысқы мерекелерді еске түсіргенін айтты."}],"transcript":"Last December, my friends and I were planning to celebrate New Year's Eve at my house. The weather report said it would be cold, but there was no mention of snow in our city. We set up a small fire pit in the backyard, decorated with colorful lights, and prepared lots of snacks and drinks. About fifteen people were invited, and everyone was looking forward to chatting and playing games. Suddenly, as we were setting out the chairs outside, we noticed small white flakes falling from the sky. At first, nobody believed it was snow—we just hadn't seen it in years!\n\nThe snowfall grew heavier, covering the backyard in a soft, quiet blanket. Some of my friends, especially the younger ones, had never seen real snow before, so everyone rushed outside with their phones and started taking pictures. We threw snowballs, built a lopsided snowman, and used pots and pans to sled down a small hill. Later, we drank hot chocolate inside to warm up, sharing stories and laughing at our wet clothes. At midnight, we watched fireworks light up the snowy sky, and one friend said it reminded him of winter holidays in his home country. Everyone agreed it was the most magical New Year's Eve we would ever have, and we wished for more snowy celebrations in the future.","translation":{"ru":"В декабре прошлого года мы с друзьями планировали встретить Новый год у меня дома. Прогноз обещал холодную погоду, но о снеге в нашем городе ничего не говорилось. Мы поставили во дворе небольшую чашу для костра, украсили всё разноцветными огнями и приготовили закуски и напитки. Мы пригласили около пятнадцати человек. Когда расставляли стулья на улице, неожиданно заметили белые снежинки. Сначала никто не поверил, что это снег: мы не видели его много лет!\n\nСнег усилился и накрыл двор мягким белым покрывалом. Некоторые друзья, особенно младшие, никогда прежде не видели настоящего снега. Все выбежали фотографироваться. Мы играли в снежки, слепили кривоватого снеговика и катались с небольшой горки на кастрюлях и сковородках. Позже мы согрелись горячим шоколадом дома, рассказывали истории и смеялись над мокрой одеждой. В полночь мы смотрели фейерверки над заснеженным небом. Один друг сказал, что эта картина напомнила ему зимние праздники на родине. Все согласились, что это был самый волшебный Новый год, и пожелали больше снежных праздников в будущем.","kk":"Өткен желтоқсанда достарыммен бірге Жаңа жылды менің үйімде қарсы алуды жоспарладық. Ауа райы болжамында күн суық болады делінді, бірақ қаламызда қар жауатыны айтылмады. Аулада шағын от жағатын орын дайындап, түрлі түсті шамдар іліп, тіскебасарлар мен сусындар әзірледік. Шамамен он бес адам шақырылды. Сыртта орындықтарды орналастырып жатқанда аспаннан ақ ұлпалар түсе бастағанын байқадық. Алғашында ешкім сенбеді, өйткені бірнеше жылдан бері қар көрмеген едік!\n\nҚар күшейіп, ауланы жұмсақ ақ көрпедей жапты. Кейбір достарым, әсіресе жастары, бұрын нағыз қар көрмеген екен. Барлығы сыртқа шығып, суретке түсті. Біз қар атысып, қисықтау аққала жасап, шағын төбеден кәстрөлдер мен табаларды шана ретінде пайдаланып сырғанадық. Кейін үйге кіріп, ыстық шоколад ішіп жылындық, әңгімелесіп, су болған киімдерімізге күлдік. Түн ортасында қарлы аспандағы отшашуды тамашаладық. Бір досым бұл көрініс өз еліндегі қысқы мерекелерді еске түсіретінін айтты. Барлығымыз бұл ең сиқырлы Жаңа жыл кеші болғанына келісіп, алдағы уақытта да қарлы мерекелер болуын тіледік."},"words":[{"word":"celebrate","syn":"mark, observe","ru":"праздновать","kk":"тойлау"},{"word":"weather report","syn":"forecast","ru":"прогноз погоды","kk":"ауа райы болжамы"},{"word":"set up","syn":"arrange, prepare","ru":"устанавливать, готовить","kk":"орналастыру, дайындау"},{"word":"suddenly","syn":"unexpectedly","ru":"внезапно","kk":"кенеттен"},{"word":"snowfall","syn":"falling snow","ru":"снегопад","kk":"қар жауу"},{"word":"rush outside","syn":"hurry outdoors","ru":"выбежать наружу","kk":"сыртқа асығып шығу"},{"word":"lopsided","syn":"uneven, crooked","ru":"кривоватый","kk":"қисықтау"},{"word":"remind","syn":"bring to mind","ru":"напоминать","kk":"еске түсіру"},{"word":"magical","syn":"wonderful, enchanting","ru":"волшебный","kk":"сиқырлы"}],"durationSeconds":86,"limit":86},{"file":"en-at-the-museum-72.mp3","title":"At the Museum","topic":"Культура и искусство","level":"A2","questions":[{"q":"How old was Danielle?","options":["8","9","10","11"],"correct":2,"ru":"В тексте прямо сказано, что Даниэль — десятилетняя дочь Минди (10 year old daughter). Поэтому правильный ответ — 10.","kk":"Мәтінде Даниэль Миндидің он жастағы қызы екені айтылған (10 year old daughter). Сондықтан дұрыс жауап — 10.","why":""},{"q":"What exhibit was Danielle excited to see?","options":["Fossils","Architecture","Animals","Plants"],"correct":0,"ru":"Даниэль очень хотела увидеть выставку окаменелостей (fossil exhibit). Поэтому верный вариант — Fossils.","kk":"Даниэль қазба қалдықтарының көрмесін (fossil exhibit) көргісі келді. Сондықтан дұрыс жауап — Fossils.","why":""},{"q":"How many tickets did Mindy buy?","options":["1","2","3","4"],"correct":1,"ru":"Минди попросила два билета: один детский и один взрослый. Всего это 2 билета.","kk":"Минди бір балаға және бір ересек адамға билет сұрады. Барлығы 2 билет.","why":""},{"q":"How much did the tickets cost?","options":["$52","$53","$54","$55"],"correct":0,"ru":"Сотрудница музея назвала общую стоимость одного детского и одного взрослого билета — 52 доллара.","kk":"Мұражай қызметкері бір бала мен бір ересек адамның билеттері бірге 52 доллар тұратынын айтты.","why":""},{"q":"What did the receptionist put on Mindy and Danielle?","options":["A badge","A sticker","A wristband","A stamp"],"correct":2,"ru":"В тексте сказано: «The receptionist put a wristband on Mindy and then Danielle». Значит, им надели браслеты.","kk":"Мәтінде қызметкер алдымен Миндиге, содан кейін Даниэльге білезік (wristband) таққаны жазылған.","why":""},{"q":"Where did the receptionist point while giving directions?","options":["Out the door","To the fossils","To the ticket counter","Down the hallway"],"correct":3,"ru":"Сотрудница указала вдоль коридора (pointed down a hallway), объясняя, как пройти к экспозиции.","kk":"Қызметкер көрмеге баратын жолды түсіндіргенде дәліз бойын (down the hallway) нұсқады.","why":""},{"q":"What did the receptionist put on them?","options":["A badge","A sticker","A wristband","A stamp"],"correct":2},{"q":"Where did the receptionist point?","options":["Out the door","To the fossils","To the ticket counter","Down the hallway"],"correct":3}],"transcript":"Mindy was taking her 10 year old daughter, Danielle, to the museum. Danielle was excited to see the fossil exhibit. Mindy and Danielle walked to the ticket counter when they arrived at the museum.\n\n“Can I have two tickets please?” Mindy asked the receptionist.\n\n“One child and one adult ticket will be $52,” the receptionist said. Mindy paid for the tickets. The receptionist put a wristband on Mindy and then Danielle.\n\n“Thank you,” Mindy said. “Where can we find the dinosaur fossil exhibit?” She asked.\n\nThe receptionist pointed down a hallway. “At the end of this hall, past the architecture display, and to the left is the fossil section,” she said.\n\n“Thank you,” said Mindy. Danielle gave Mindy's hand a squeeze. She was so excited to be at the museum.","translation":{"kk":"Минди он жастағы қызы Даниэльді мұражайға алып келді. Даниэль қазба қалдықтарының көрмесін көруге асықты. Мұражайға келген соң, олар билет сататын орынға барды.\n\n«Екі билет бересіз бе?» — деп сұрады Минди қызметкерден.\n\n«Бір балаға және бір ересек адамға билет 52 доллар болады», — деді қызметкер. Минди билеттердің ақысын төледі. Қызметкер алдымен Миндиге, содан кейін Даниэльге білезік тақты.\n\n«Рақмет», — деді Минди. «Динозаврлардың қазба қалдықтары көрмесін қайдан табамыз?»\n\nҚызметкер дәлізді нұсқады. «Осы дәліздің соңына дейін барып, сәулет экспозициясынан өтіп, солға бұрылсаңыздар, қазба қалдықтары бөлімі орналасқан», — деді ол.\n\n«Рақмет», — деді Минди. Даниэль анасының қолын қысты. Ол мұражайға келгеніне қатты қуанды.","ru":"Минди привела свою десятилетнюю дочь Даниэль в музей. Даниэль с нетерпением ждала возможности увидеть выставку окаменелостей. Когда они пришли в музей, Минди и Даниэль подошли к кассе.\n\n«Можно два билета, пожалуйста?» — спросила Минди у сотрудницы.\n\n«Один детский и один взрослый билет будут стоить 52 доллара», — ответила сотрудница. Минди оплатила билеты. Сотрудница надела браслет сначала Минди, а затем Даниэль.\n\n«Спасибо», — сказала Минди. «Где мы можем найти выставку окаменелостей динозавров?»\n\nСотрудница указала вдоль коридора. «В конце этого коридора, за архитектурной экспозицией, поверните налево — там находится отдел окаменелостей», — сказала она.\n\n«Спасибо», — сказала Минди. Даниэль крепко сжала мамину руку. Она была очень рада оказаться в музее."},"words":[{"word":"excited","syn":"thrilled","ru":"взволнованный, радостный","kk":"қуанышты, қатты қуанған"},{"word":"exhibit","syn":"display","ru":"экспозиция, выставка","kk":"көрме, экспозиция"},{"word":"receptionist","syn":"attendant","ru":"сотрудник приёмной","kk":"келушілерді қарсы алушы қызметкер"},{"word":"ticket counter","syn":"ticket desk","ru":"билетная касса","kk":"билет кассасы"},{"word":"wristband","syn":"bracelet","ru":"браслет на запястье","kk":"білекке тағылатын білезік"},{"word":"hallway","syn":"corridor","ru":"коридор","kk":"дәліз"},{"word":"fossil","syn":"preserved remains","ru":"окаменелость, ископаемые останки","kk":"қазба қалдықтары"},{"word":"pointed","syn":"indicated","ru":"указал(а)","kk":"нұсқады"},{"word":"squeeze","syn":"press","ru":"сжать","kk":"қысып ұстау"},{"word":"section","syn":"area","ru":"отдел, зона","kk":"бөлім, аймақ"}],"durationSeconds":null,"supplemental":true,"limit":50},{"file":"en-bonnie-and-clyde-72.mp3","title":"Bonnie and Clyde","topic":"История и общество","level":"B1","questions":[{"q":"In which years were Bonnie and Clyde famous?","options":["The early 1700’s","The mid-1800’s","The early 1900’s","The mid-1900’s"],"correct":2,"ru":"Текст относит их известность к началу XX века, то есть к началу 1900-х годов.","kk":"Мәтінде олардың XX ғасырдың басында танымал болғаны айтылады, яғни 1900-жылдардың басы.","why":""},{"q":"In which country was the couple famous?","options":["Canada","Germany","The United States of America","China"],"correct":2,"ru":"В тексте сказано, что это была американская пара, известная среди населения США.","kk":"Мәтінде олардың америкалық жұп екені және АҚШ халқы арасында танымал болғаны айтылған.","why":""},{"q":"Why was the couple famous in the country?","options":["Their brutal robberies","Their youth","Their good looks","The fact that Bonnie, a woman, performed brutal crimes"],"correct":3,"ru":"Особое внимание привлекало то, что Бонни была молодой женщиной, совершавшей тяжкие преступления: в то время это считалось необычным.","kk":"Боннидің жас әйел бола тұра ауыр қылмыс жасауы жұрт назарын аударған, өйткені ол кезеңде мұндай жағдай тосын болған.","why":""},{"q":"In which year was the couple apprehended?","options":["1774","1934","1882","1995"],"correct":1,"ru":"В последнем абзаце указан 1934 год, когда правоохранители настигли пару.","kk":"Соңғы абзацта құқық қорғаушылар жұпты 1934 жылы ұстағаны айтылған.","why":""},{"q":"When was the couple ambushed?","options":["As they were traveling to visit a friend","As they were having lunch at a restaurant","They were hiding in the forest","On their way home"],"correct":0,"ru":"Полицейские устроили засаду, когда Бонни и Клайд направлялись навестить друга.","kk":"Құқық қорғаушылар Бонни мен Клайд досына баруға бара жатқанда тұтқиылдан шабуыл жасаған.","why":""},{"q":"What did the officers do upon catching the criminals?","options":["They took them to the station","They shot them dead","They let them go","They did not catch the criminals"],"correct":1,"ru":"В конце текста сказано, что сотрудники правоохранительных органов застрелили обоих.","kk":"Мәтіннің соңында құқық қорғау қызметкерлері екеуін де атып өлтіргені айтылған.","why":""},{"q":"When were Bonnie and Clyde famous?","options":["Early 1700s","Mid-1800s","Early 1900s","Mid-1900s"],"correct":2},{"q":"In which country were they famous?","options":["Canada","Germany","United States","China"],"correct":2}],"transcript":"","translation":{"kk":"","ru":"Бонни мен Клайд XX ғасырдың басында танымал болған америкалық жұп еді. Екеуі де негізінен тонаумен айналысқан кәнігі қылмыскерлер болатын. Кейде құқық қорғау қызметкерлерінен құтылу үшін кісі өлтіруге де барған. Оларға көмектескен басқа қылмыскерлерден құралған топты да басқарған.\n\nАмерика халқы бұл жұпты романтикалық кейіпкерлер ретінде қабылдап, оларға сүйсінген. Мұның бір себебі — Боннидің жас әйел қылмыскер болуы: ол кездегі америкалық қоғам үшін бұл тосын жағдай еді. Бір-біріне ғашық екі қатыгез қылмыскердің оқиғасы да жұртты қызықтырған.\n\nЖұп пен олардың тобы бірнеше жыл бойы заңнан қашып жүрген. 1934 жылы олардың жолы болмай, құқық қорғау қызметкерлерінің тобы оларды қуып жеткен. Досына баруға жолға шыққан кезде қызметкерлер оларға тұтқиылдан шабуыл жасап, екеуін де атып өлтірген."},"words":[{"word":"famous","syn":"well-known","ru":"известный","kk":"танымал"},{"word":"hardened","syn":"experienced","ru":"закоренелый","kk":"кәнігі"},{"word":"robberies","syn":"thefts","ru":"ограбления","kk":"тонаулар"},{"word":"occasionally","syn":"sometimes","ru":"иногда","kk":"кейде"},{"word":"ward off","syn":"repel","ru":"отгонять, предотвращать","kk":"тойтару, болдырмау"},{"word":"adored","syn":"admired","ru":"обожали","kk":"сүйсінді"},{"word":"unheard of","syn":"unprecedented","ru":"неслыханный","kk":"бұрын-соңды болмаған"},{"word":"enthralling","syn":"fascinating","ru":"захватывающий","kk":"қызықтыратын"},{"word":"evade","syn":"escape","ru":"избегать","kk":"қашып құтылу"},{"word":"ambushed","syn":"surprised","ru":"устроили засаду","kk":"тұтқиылдан шабуылдады"}],"durationSeconds":null,"supplemental":true,"limit":55},{"file":"en-breaking-stereotypes-72.mp3","title":"Breaking Stereotypes","topic":"Общество и ценности","level":"B2","questions":[{"q":"What is a stereotype?","options":["An assumption about someone based on group characteristics","Treating everyone as an individual","Learning about different cultures","Being open to new ideas"],"correct":0,"ru":"Стереотип — это предположение о человеке на основании признаков группы, а не его личных качеств.","kk":"Стереотип — адамның жеке қасиеттеріне емес, белгілі бір топқа тән белгілерге сүйеніп жасалған болжам.","why":"A stereotype is an assumption about a person or group based on shared characteristics."},{"q":"Which situation is an example of stereotyping?","options":["Milo watches a new film with his friends.","Layla supports a candidate after reading her policies.","Kenny assumes a new classmate is boring because of their background.","Kasie finishes her homework before going outside."],"correct":2,"ru":"Кенни заранее судит об однокласснике по его происхождению, не узнав его лично.","kk":"Кенни жаңа сыныптасын жақынырақ танымастан, шыққан тегіне қарап бағалайды.","why":"Kenny judges someone before getting to know them, using a group-based assumption."},{"q":"According to the passage, how can you prevent stereotyping?","options":["Be narrow-minded.","Be judgmental of others.","Be open-minded.","Have an egocentric mindset."],"correct":2,"ru":"В тексте рекомендуется быть открытым к разным людям и принимать различия.","kk":"Мәтінде әртүрлі адамдарға ашық болып, айырмашылықтарды қабылдау ұсынылады.","why":"The passage recommends keeping an open mind and accepting differences."},{"q":"Which quality is NOT listed as a basis for stereotyping?","options":["Ethnicity","Race","Religion","None of the above"],"correct":3,"ru":"В тексте названы этническая принадлежность, раса и религия, поэтому среди первых трёх нет исключения.","kk":"Мәтінде этникалық шығу тегі, нәсіл және дін аталады, сондықтан алғашқы үшеуінің ешқайсысы ерекшелік емес.","why":"The passage includes ethnicity, race and religion as possible bases for stereotypes."},{"q":"Which stereotype is mentioned in the passage?","options":["Women being more gentle","Baby Boomers being young","All people having identical personalities","Everyone enjoying the same activities"],"correct":0,"ru":"В тексте среди примеров стереотипов упоминаются представления о женщинах.","kk":"Мәтінде стереотиптің мысалы ретінде әйелдер туралы қалыптасқан түсініктер аталады.","why":"The passage mentions stereotypes about women as an example."},{"q":"What are the two types of stereotyping described in the passage?","options":["False and true","Negative and positive","Judgmental and non-judgmental","None of the above"],"correct":1,"ru":"В тексте сказано, что стереотипы бывают отрицательными и положительными, но оба вида обобщают людей.","kk":"Мәтінде стереотиптер жағымсыз және жағымды болуы мүмкін екені, алайда екеуі де жалпылау екені түсіндіріледі.","why":"The passage explains that stereotypes can be negative or positive, but both are generalizations."},{"q":"Which action can help challenge stereotypes?","options":["Getting to know people as individuals","Assuming everyone is identical","Avoiding unfamiliar viewpoints","Judging people by appearances"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"Why can stereotypes be harmful?","options":["They can lead to unfair judgments","They improve every decision","They guarantee accurate predictions","They prevent all disagreements"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."}],"transcript":"America has been known for creating stereotypes throughout history — from 'Baby Boomers' to 'flappers' and even more. What is stereotyping? Stereotyping is when you make assumptions about an individual or group based on the whole race, religion, culture, ethnicity, or other quality. It is important to note that while some stereotypes can be positive, a majority of pre-existing ones are negative.\n\nMany of us fall prey to stereotyping others without even realizing it. However, in today's modern world, the younger generation has developed a more unique, and broader mindset that may foretell the end of stereotyping. How do they do it? One easy tip to follow is to always keep an open-minded and accept that everyone around you is different; no two individuals are forced to behave the same based on their shared qualities. By being open and accepting, we are taking one step closer to a world of freedom and diversity.","translation":{"kk":"Америка тарихында «беби-бумерлерден» бастап «флэпперлерге» дейін әртүрлі топтар туралы стереотиптер қалыптасқан. Стереотиптеу дегеніміз не? Бұл — адамның немесе топтың нәсіліне, дініне, мәдениетіне, этникалық шығу тегіне не басқа белгісіне қарап алдын ала болжам жасау. Кейбір стереотиптер жағымды болуы мүмкін, бірақ бұрыннан қалыптасқан стереотиптердің көбі жағымсыз екенін ескеру керек.\n\nКөпшілігіміз өзіміз байқамай басқа адамдар туралы стереотипке сүйеніп ойлаймыз. Алайда қазіргі әлемде жас ұрпақтың ой-өрісі кеңейіп, стереотиптерді азайтуға мүмкіндік пайда болды. Бұған қалай қол жеткізуге болады? Ең қарапайым жол — ашық көзқарасты сақтап, айналадағы адамдардың әртүрлі екенін қабылдау. Ортақ белгілері бар адамдардың бәрі бірдей әрекет етуге міндетті емес. Айырмашылықтарды қабылдау арқылы еркіндік пен алуан түрлілікке жақындаймыз.","ru":"На протяжении истории в Америке возникало множество стереотипов — от представлений о «беби-бумерах» до «флэпперов» и других групп. Что такое стереотипизация? Это когда о человеке или группе делают предположения на основании расы, религии, культуры, этнической принадлежности или других признаков. Важно помнить, что хотя некоторые стереотипы могут быть положительными, большинство давно существующих стереотипов отрицательные.\n\nМногие из нас поддаются стереотипам, даже не замечая этого. Однако в современном мире молодое поколение формирует более широкий и открытый взгляд, который может положить конец стереотипизации. Как этого добиться? Простой совет — сохранять открытость и принимать то, что все люди разные. Люди не обязаны вести себя одинаково только потому, что у них есть общие черты. Принимая различия, мы приближаемся к миру свободы и многообразия."},"words":[{"word":"start","syn":"begin","ru":"начинать","kk":"бастау"},{"word":"business","syn":"enterprise","ru":"бизнес, дело","kk":"кәсіп"},{"word":"pluck","syn":"pull out","ru":"вырывать","kk":"жұлу"},{"word":"charge","syn":"ask for payment","ru":"взимать плату","kk":"ақы алу"},{"word":"purchase","syn":"buy","ru":"покупать","kk":"сатып алу"},{"word":"investment","syn":"financial commitment","ru":"вложение","kk":"инвестиция"},{"word":"improve","syn":"develop","ru":"улучшать","kk":"жақсарту"},{"word":"customer","syn":"client","ru":"клиент","kk":"тұтынушы"},{"word":"increase","syn":"raise","ru":"повышать","kk":"арттыру"},{"word":"settle on","syn":"decide on","ru":"остановить выбор на","kk":"таңдау жасау"}],"durationSeconds":null,"supplemental":true,"limit":63},{"file":"en-early-history-of-paper-72.mp3","title":"The Early History of Paper","topic":"Промышленность и изобретения","level":"B2","questions":[{"q":"What is papyrus?","options":["A plant","A paper material","A person","Both a plant and a paper material"],"correct":3},{"q":"Where does papyrus grow?","options":["South Africa","Rome","Egypt","Greece"],"correct":2},{"q":"Which plant part was cut into thin strips?","options":["Roots","Stems","Leaves","Flowers"],"correct":1},{"q":"What color were the sheets?","options":["Brown","Gray","Green","White"],"correct":3},{"q":"What were the first books called?","options":["Scrolls","Rolls","Novels","Magazines"],"correct":0},{"q":"How many layers were used?","options":["One","Two","Three","Four"],"correct":1},{"q":"What was an important effect of the development of paper?","options":["Making writing materials more accessible","Eliminating the need for written records","Replacing all forms of communication","Preventing books from being produced"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What is a key purpose of paper in human history?","options":["Recording and sharing information","Producing electrical energy","Constructing metal tools","Measuring ocean depth"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."}],"transcript":"When the Egyptians first started writing, they carved their words into stone. Later they discovered that a plant called papyrus, which grows near the Nile River, could be used to make writing material.\n\nThey cut the fibers in the stems into thin strips, then pressed them together. A second layer was laid on top and pressed. Then the sheet was dried in the sun. The paper that resulted was called papyrus and was pure white. Ten or twenty of these sheets could be glued together to form a roll. These were the scrolls, the first books. They were very difficult to make and, therefore, very expensive.\n\nThe Greeks and the Romans also used this system for centuries.","translation":{"kk":"Мысырлықтар алғаш жазу жаза бастағанда, сөздерін тасқа қашап түсірген. Кейін олар Ніл өзенінің маңында өсетін папирус өсімдігін жазу материалы ретінде пайдалануға болатынын анықтады.\n\nОлар сабақтағы талшықтарды жіңішке жолақтарға кесіп, бір-біріне нығыздаған. Үстіне екінші қабат қойып, қайта басқан. Содан кейін парақты күнге кептірген. Осылай алынған папирус аппақ болған. Осындай он немесе жиырма парақты біріктіріп, шиыршық жасауға болатын. Бұл шиыршықтар алғашқы кітаптар еді. Оларды жасау өте қиын болғандықтан, бағасы да қымбат болды.\n\nГректер мен римдіктер де бұл әдісті ғасырлар бойы қолданған.","ru":"Когда египтяне впервые начали писать, они высекали слова на камне. Позже они обнаружили, что растение папирус, растущее возле реки Нил, можно использовать для изготовления материала для письма.\n\nОни разрезали волокна стеблей на тонкие полоски и спрессовывали их. Сверху укладывали второй слой и снова прессовали. Затем лист сушили на солнце. Полученный материал назывался папирусом и был совершенно белым. Десять или двадцать таких листов можно было склеить в свиток. Эти свитки стали первыми книгами. Их было очень сложно изготавливать, поэтому они стоили дорого.\n\nГреки и римляне также пользовались этой системой на протяжении многих веков."},"words":[],"durationSeconds":null,"supplemental":true,"limit":44},{"file":"en-facts-about-bats-72.mp3","title":"Facts About Bats","topic":"Природа и животные","level":"B1","questions":[{"q":"Where do bats live?","options":["Underneath the ground","In abandoned birds’ nests","In caves","In bushes"],"correct":2,"why":"The passage names caves, trees, bridges and old buildings as habitats."},{"q":"What do bats eat?","options":["Nuts","Other bats","Grass","Insects"],"correct":3,"why":"Some bat species eat insects; others eat fruit."},{"q":"How long is the lifespan of a bat?","options":["Around 10 years","Around 20 years","No more than 5 years","30 years or more"],"correct":1,"why":"The final sentence says their lifespan is around 20 years."},{"q":"What color is a bat’s fur?","options":["White","Gray and white striped","Brown","Brown with tan spots"],"correct":2,"why":"Brown is one of the fur colors explicitly mentioned."},{"q":"What animals hunt bats?","options":["Deer","Raccoons","Herons","Prairie dogs"],"correct":1,"why":"Raccoons are listed among predators of bats."},{"q":"How many bats can live in a colony?","options":["No more than 10","Thousands","Hundreds","Three or four"],"correct":1,"why":"Colonies can number in the thousands."},{"q":"When do bats usually come out to hunt?","options":["Early in the morning","At noon","At night","During the afternoon"],"correct":2,"why":"Bats rest during the day and hunt at night."},{"q":"Where do predators often wait to catch bats?","options":["Inside the trees","Outside a cave opening","Under the water","In farm fields"],"correct":1,"why":"Predators wait outside the opening to a bat cave at nightfall."}],"transcript":"Bats are flying mammals. They have brown, gray, red, tan, or black fur. Some species of bat eat insects while others eat fruit. There are three species of bat that drink blood from cows, horses, and other farm animals.\n\nBats can live in caves, in trees, under bridges and in old buildings. They're social animals that live in colonies that can number in the thousands. Bats rest during the day and come out at night to hunt.\n\nSome of the animals that eat bats include raccoons, snakes, hawks, and weasels. These animals usually wait outside of the opening to a bat's cave in order to capture bats as they fly out at nightfall. Bats have a lifespan of around 20 years.","translation":{"kk":"Жарқанаттар — ұшатын сүтқоректілер. Олардың жүні қоңыр, сұр, қызғылт, сарғыш-қоңыр немесе қара болады. Кейбір түрлері жәндіктермен, ал басқалары жемістермен қоректенеді. Жарқанаттардың үш түрі сиырлардың, жылқылардың және басқа да ауыл шаруашылығы жануарларының қанын ішеді.\n\nЖарқанаттар үңгірлерде, ағаштарда, көпірлердің астында және ескі ғимараттарда өмір сүре алады. Олар мыңдаған дарадан тұратын топтарда тіршілік ететін әлеуметтік жануарлар. Күндіз демалып, түнде аң аулауға шығады.\n\nЖарқанаттармен еноттар, жыландар, қаршығалар және ақкістер қоректенеді. Бұл жыртқыштар көбіне үңгірдің кіреберісінде күтіп, қараңғы түскенде ұшып шыққан жарқанаттарды ұстайды. Жарқанаттардың өмір сүру ұзақтығы шамамен 20 жыл.","ru":"Летучие мыши — летающие млекопитающие. Их мех бывает коричневым, серым, рыжим, светло-коричневым или чёрным. Одни виды питаются насекомыми, другие — фруктами. Три вида летучих мышей пьют кровь коров, лошадей и других сельскохозяйственных животных.\n\nЛетучие мыши могут жить в пещерах, на деревьях, под мостами и в старых зданиях. Это социальные животные, которые живут колониями, насчитывающими тысячи особей. Днём они отдыхают, а ночью вылетают на охоту.\n\nНа летучих мышей охотятся еноты, змеи, ястребы и ласки. Эти хищники обычно поджидают их у входа в пещеру, чтобы поймать, когда они вылетают с наступлением темноты. Продолжительность жизни летучих мышей — около 20 лет."},"words":[{"word":"mammal","syn":"—","kk":"сүтқоректі","ru":"млекопитающее"},{"word":"fur","syn":"—","kk":"жүн","ru":"мех"},{"word":"species","syn":"kind","kk":"түр","ru":"вид"},{"word":"insect","syn":"—","kk":"жәндік","ru":"насекомое"},{"word":"cave","syn":"—","kk":"үңгір","ru":"пещера"},{"word":"bridge","syn":"—","kk":"көпір","ru":"мост"},{"word":"colony","syn":"—","kk":"топ, колония","ru":"колония"},{"word":"hunt","syn":"—","kk":"аң аулау","ru":"охотиться"},{"word":"raccoon","syn":"—","kk":"енот","ru":"енот"},{"word":"hawk","syn":"—","kk":"қаршыға","ru":"ястреб"},{"word":"weasel","syn":"—","kk":"ақкіс","ru":"ласка"},{"word":"nightfall","syn":"—","kk":"қараңғы түсу","ru":"наступление темноты"},{"word":"lifespan","syn":"—","kk":"өмір сүру ұзақтығы","ru":"продолжительность жизни"}],"durationSeconds":null,"limit":null},{"file":"en-fall-colors-72.mp3","title":"Fall Colors","topic":"Природа и климат","level":"B1","questions":[{"q":"Where is a good area to view the fall colors in the trees?","options":["The west coast","The south","New England","The southwest"],"correct":2,"ru":"В тексте Новая Англия (New England) названа одним из мест, куда люди приезжают смотреть на яркие осенние листья.","kk":"Мәтінде Жаңа Англия (New England) адамдар күзгі түрлі түсті жапырақтарды көруге баратын аймақтардың бірі ретінде аталады.","why":""},{"q":"What chemical causes the green color in leaves?","options":["Carotenoid","Chlorophyll","Xanthophyll","Anthocyanin"],"correct":1,"ru":"Листья зелёные благодаря хлорофиллу (chlorophyll). Именно это вещество придаёт им зелёный цвет.","kk":"Жапырақтың жасыл түсі хлорофиллге (chlorophyll) байланысты. Жасыл түсті беретін зат — осы.","why":""},{"q":"Which compound breaks down first?","options":["The green chlorophyll","The yellow xanthophyll","The red anthocyanin","The orange carotenoid"],"correct":0,"ru":"При понижении температуры и сокращении светового дня разрушается зелёный хлорофилл. После этого становятся заметны другие цвета.","kk":"Температура төмендеп, күн қысқарғанда жасыл хлорофилл ыдырайды. Содан кейін басқа түстер анық көріне бастайды.","why":""},{"q":"Photosynthesis is the chemical process that converts what into food for plants?","options":["Water","Oxygen","Bugs","Sunlight"],"correct":3,"ru":"В тексте сказано, что при фотосинтезе энергия света превращается в пищу для дерева. Поэтому правильный вариант — sunlight (солнечный свет).","kk":"Мәтінде фотосинтез кезінде жарық энергиясы ағашқа қажетті қорекке айналатыны айтылады. Сондықтан дұрыс жауап — sunlight (күн сәулесі).","why":""},{"q":"What causes the chlorophyll to break down?","options":["Too much rainfall","Too little rainfall","Hot weather","Shorter days"],"correct":3,"ru":"Автор объясняет: когда дни становятся короче и температура падает, хлорофилл разрушается. Из предложенных вариантов подходит shorter days.","kk":"Автор күн қысқарып, температура төмендегенде хлорофилл ыдырайтынын түсіндіреді. Берілген нұсқалардың ішінен shorter days дұрыс.","why":""},{"q":"Tourists are important because they:","options":["Leave litter behind them.","Spend a lot of money on vacation.","Never know where they’re going.","Can be very obnoxious."],"correct":1,"ru":"В тексте сказано, что туризм важен для экономики этих районов. Это связано с тем, что путешественники тратят деньги во время поездок.","kk":"Мәтінде туризм осы аймақтардың экономикасы үшін маңызды делінген. Себебі саяхатшылар демалыс кезінде ақша жұмсайды.","why":""},{"q":"Where can people see fall colors?","options":["West coast","South","New England","Southwest"],"correct":2},{"q":"What chemical makes leaves green?","options":["Carotenoid","Chlorophyll","Xanthophyll","Anthocyanin"],"correct":1}],"transcript":"Autumn is the season of color. The leaves turn from green to red, yellow, and orange. The turning of the leaves is a popular time to travel to places like New England, Michigan, Minnesota, and Wisconsin to see the beautiful colors. This tourism is an important part of the economy in these areas.\n\nFrom spring through the end of summer, the leaves are green because of the chemical called chlorophyll, which converts the energy of light into food for the tree, a process called photosynthesis. But when temperatures drop and the days get shorter, the chlorophyll breaks down. There are other compounds that help in photosynthesis, but they are yellow, orange, red and even pink or purple. Once the green goes away, the other brilliant colors shine forth for a few weeks. Then the leaves fall and it's time to rake.","translation":{"kk":"Күз — түрлі түстер мезгілі. Жапырақтар жасыл түстен қызыл, сары және қызғылт сары түске өзгереді. Осы кезде көптеген адамдар күзгі әсем түстерді көру үшін Жаңа Англияға, Мичиганға, Миннесотаға және Висконсинге саяхаттайды. Мұндай туризм осы аймақтардың экономикасы үшін маңызды.\n\nКөктемнен жаздың соңына дейін жапырақтар хлорофилл деп аталатын заттың арқасында жасыл болады. Хлорофилл жарық энергиясын ағашқа қажетті қорекке айналдыруға көмектеседі; бұл үдеріс фотосинтез деп аталады. Ауа температурасы төмендеп, күн қысқарғанда хлорофилл ыдырайды. Жапырақтарда фотосинтезге қатысатын сары, қызғылт сары, қызыл, тіпті қызғылт және күлгін түсті басқа қосылыстар да бар. Жасыл түс жоғалғаннан кейін осы ашық түстер бірнеше апта бойы көрінеді. Содан кейін жапырақтар түсіп, оларды жинайтын уақыт келеді.","ru":"Осень — время ярких красок. Листья меняют цвет с зелёного на красный, жёлтый и оранжевый. В этот период многие путешествуют в Новую Англию, Мичиган, Миннесоту и Висконсин, чтобы полюбоваться осенними красками. Такой туризм играет важную роль в экономике этих регионов.\n\nС весны до конца лета листья зелёные благодаря хлорофиллу — веществу, которое помогает превращать энергию света в пищу для дерева в процессе фотосинтеза. Когда температура снижается, а дни становятся короче, хлорофилл разрушается. В листьях есть и другие соединения, участвующие в фотосинтезе: они имеют жёлтый, оранжевый, красный и даже розовый или фиолетовый цвет. Когда зелёный пигмент исчезает, другие яркие цвета становятся заметны на несколько недель. Затем листья опадают, и приходит время их сгребать."},"words":[{"word":"autumn","syn":"fall","ru":"осень","kk":"күз"},{"word":"leaves","syn":"foliage","ru":"листья","kk":"жапырақтар"},{"word":"turn","syn":"change","ru":"меняться","kk":"өзгеру"},{"word":"popular","syn":"well-liked","ru":"популярный","kk":"танымал"},{"word":"beautiful","syn":"gorgeous","ru":"красивый","kk":"әдемі"},{"word":"economy","syn":"economic system","ru":"экономика","kk":"экономика"},{"word":"chemical","syn":"substance","ru":"химическое вещество","kk":"химиялық зат"},{"word":"convert","syn":"transform","ru":"превращать","kk":"айналдыру"},{"word":"energy","syn":"power","ru":"энергия","kk":"қуат"},{"word":"drop","syn":"decrease","ru":"снижаться","kk":"төмендеу"},{"word":"shorter","syn":"briefer","ru":"короче","kk":"қысқарақ"},{"word":"break down","syn":"decompose","ru":"разрушаться","kk":"ыдырау"},{"word":"brilliant","syn":"vivid","ru":"яркий","kk":"ашық түсті"},{"word":"rake","syn":"gather leaves","ru":"сгребать листья","kk":"жапырақтарды жинау"}],"durationSeconds":null,"supplemental":true,"limit":50},{"file":"en-giving-back-to-your-environment-72.mp3","title":"Giving Back to Your Environment","topic":"Экология","level":"B1","questions":[{"q":"What is the first way to help the environment mentioned in the passage?","options":["Recycling","Reducing","Reusing","Turning things off"],"correct":3,"why":"The passage first suggests turning off things that are not in use."},{"q":"Which resource is NOT mentioned in the first paragraph?","options":["Electricity","Water","Fuel","Natural gas"],"correct":3,"why":"The resources listed are electricity, water and fuel."},{"q":"When should you turn off the lights?","options":["When the curtains are closed","When it is dark outside","When it is sunny outside","When the television is on"],"correct":2,"why":"The passage suggests switching lights off when it is sunny outside."},{"q":"Which is NOT one of the 3 Rs?","options":["Reuse","Recycle","Repurpose","Reduce"],"correct":2,"why":"The three Rs are Reduce, Reuse and Recycle."},{"q":"What should we NOT do when recycling?","options":["Place paper separately","Place plastic separately","Throw plastic and paper in the trash","Collect different materials separately"],"correct":2,"why":"Plastic and paper should be separated instead of thrown in the trash."},{"q":"What is the purpose of the 3 Rs?","options":["Increase the amount of trash","Reduce the amount of trash","Make more disposable bags","Use more resources"],"correct":1,"why":"The passage says the 3 Rs help reduce trash going to landfills."},{"q":"What can replace several plastic grocery bags?","options":["A large cloth bag","Several paper cups","A new plastic bottle","A cardboard plate"],"correct":0,"why":"The example recommends using one large cloth bag."},{"q":"What does “Reuse” mean in the passage?","options":["Buy a replacement for every item","Throw an item away after one use","Use an item several times or for a new purpose","Mix plastic and paper in one bin"],"correct":2,"why":"Reuse means using something multiple times or in a new way."}],"transcript":"There are many ways to give back to your environment without spending money. One way is by turning off anything not in use. This means turning off the lights when it is sunny outside, turning off the faucet when you are brushing your teeth, and even turning off the TV when no one is watching it. These simples acts are a few ways we can save vital resources such as electricity, water, and fuel. Why should we conserve these resources? We should do this because every day is Earth Day! It is never too late to make an impact on your environment and do your part in sustaining our planet.\n\nAnother way is to Reduce, Reuse, and Recycle. The 3 Rs are simple ways that we can do our part in reducing the amount of trash that goes to landfills. Reduce means that we should use less of an item than we need. For example, if you need multiple plastic bags to carry your groceries, you can use one large cloth bag instead. Reuse means that we should use an item multiple times, or even use it for something new instead of throwing it away. Recycle means that we should place plastic and paper separately, rather than throw them in the trash.","translation":{"kk":"Қоршаған ортаға ақша жұмсамай-ақ көмектесудің көптеген жолы бар. Соның бірі — пайдаланылмай тұрған заттарды өшіру. Мысалы, дала жарық кезде шамды сөндіру, тіс тазалағанда су шүмегін жабу және ешкім көрмегенде теледидарды өшіру. Осындай қарапайым әрекеттер электр қуаты, су және отын сияқты маңызды ресурстарды үнемдеуге көмектеседі. Бұл ресурстарды неге сақтауымыз керек? Өйткені әр күн — Жер күні! Қоршаған ортаға оң әсер етіп, ғаламшарымызды сақтауға үлес қосу ешқашан кеш емес.\n\nТағы бір жолы — Reduce, Reuse, Recycle, яғни тұтынуды азайту, қайта пайдалану және қайта өңдеу. Осы үш қағида қоқыс полигондарына түсетін қалдықтарды азайтуға көмектеседі. Азайту дегеніміз — қажеттен артық зат пайдаланбау. Мысалы, азық-түлік тасуға бірнеше пластик пакет алудың орнына бір үлкен мата сөмке қолдануға болады. Қайта пайдалану — затты бірнеше рет немесе басқа мақсатта қолдану. Қайта өңдеу — пластик пен қағазды қоқысқа араластырмай, бөлек жинау.","ru":"Есть много способов помочь окружающей среде, не тратя денег. Один из них — выключать всё, чем вы не пользуетесь. Например, выключать свет, когда на улице солнечно, закрывать кран во время чистки зубов и выключать телевизор, если его никто не смотрит. Эти простые действия помогают беречь важные ресурсы: электричество, воду и топливо. Почему их нужно сохранять? Потому что каждый день — День Земли! Никогда не поздно положительно повлиять на окружающую среду и внести вклад в сохранение нашей планеты.\n\nДругой способ — Reduce, Reuse, Recycle: сокращать потребление, использовать повторно и перерабатывать. Эти три принципа помогают уменьшить количество отходов, попадающих на свалки. Сокращать — значит использовать меньше вещей. Например, вместо нескольких пластиковых пакетов для продуктов можно взять одну большую тканевую сумку. Повторно использовать — значит применять предмет несколько раз или находить ему новое назначение. Перерабатывать — значит собирать пластик и бумагу отдельно, а не выбрасывать их вместе с мусором."},"words":[{"word":"environment","syn":"surroundings","kk":"қоршаған орта","ru":"окружающая среда"},{"word":"turn off","syn":"—","kk":"өшіру","ru":"выключать"},{"word":"faucet","syn":"—","kk":"су шүмегі","ru":"водопроводный кран"},{"word":"vital resources","syn":"—","kk":"маңызды ресурстар","ru":"важные ресурсы"},{"word":"electricity","syn":"—","kk":"электр қуаты","ru":"электричество"},{"word":"fuel","syn":"—","kk":"отын","ru":"топливо"},{"word":"conserve","syn":"—","kk":"үнемдеу, сақтау","ru":"сохранять, беречь"},{"word":"sustain","syn":"—","kk":"сақтап қалу","ru":"поддерживать, сохранять"},{"word":"reduce","syn":"—","kk":"азайту","ru":"сокращать"},{"word":"reuse","syn":"—","kk":"қайта пайдалану","ru":"использовать повторно"},{"word":"recycle","syn":"—","kk":"қайта өңдеу","ru":"перерабатывать"},{"word":"landfill","syn":"—","kk":"қоқыс полигоны","ru":"свалка"},{"word":"groceries","syn":"—","kk":"азық-түлік","ru":"продукты"},{"word":"cloth bag","syn":"—","kk":"мата сөмке","ru":"тканевая сумка"},{"word":"separately","syn":"—","kk":"бөлек","ru":"отдельно"}],"durationSeconds":null,"limit":null},{"file":"en-harriet-beecher-stowe-69.mp3","title":"Harriet Beecher Stowe","topic":"Литература и история","level":"B2","questions":[{"q":"What did Harriet think about slavery?","options":["She ignored it","She thought it was wrong","She thought it was acceptable","She thought it was necessary"],"correct":1},{"q":"Where did her family hide enslaved people?","options":["In their house","In a woodshed","In an icehouse","Outside"],"correct":0},{"q":"What was the Underground Railroad?","options":["A subway","A freight railway","A network helping people escape","A traditional railroad"],"correct":2},{"q":"When was Uncle Tom’s Cabin published?","options":["1850","1852","1862","1876"],"correct":1},{"q":"What was the novel about?","options":["A railroad","A holiday cabin","Her uncle","Slavery and its hardships"],"correct":3},{"q":"When did the Civil War begin?","options":["1850","1852","1862","1876"],"correct":2},{"q":"What were the northern states called?","options":["The Union","The South","The Confederacy","The United States"],"correct":0},{"q":"Which president invited Harriet to the White House?","options":["George Washington","Abraham Lincoln","Theodore Roosevelt","John F. Kennedy"],"correct":1}],"transcript":"Harriet Beecher Stowe lived during the time when slavery was legal in America. She believed slavery was wrong, so she fought against it. She, with her husband and children, helped several slaves escape by hiding them in their house. She was part of the Underground Railroad. The Underground Railroad wasn't really a railroad; it was people who worked together to hide slaves and help them travel to the northern states, where they could be free.\n\nHarriet wrote a book, “Uncle Tom's Cabin,” which showed how hard life could be for slaves. It was published in 1852. The book became very well known and had a strong effect on how people thought about slavery.\n\nThe Civil War began in 1862, and when the Union, or northern states, won, slavery was made illegal. Abraham Lincoln, who was president during the Civil War, invited Harriet to the White House because her novel had helped people to understand how bad slavery was.","translation":{"kk":"Гарриет Бичер-Стоу Америкада құлдық заңды болған кезеңде өмір сүрді. Ол құлдықты дұрыс емес деп санап, оған қарсы күресті. Күйеуі және балаларымен бірге бірнеше құлға көмектесіп, оларды өз үйінде жасырды. Ол «Жерасты теміржолы» деп аталған көмек желісіне қатысты. Бұл шынайы теміржол емес, адамдарға солтүстік штаттарға қашып, бостандыққа жетуге көмектескен адамдар тобы еді.\n\nГарриет құлдардың ауыр өмірін көрсететін «Том ағайдың лашығы» романын жазды. Кітап 1852 жылы жарық көріп, адамдардың құлдық туралы көзқарасына үлкен әсер етті.\n\nБастапқы мәтінде Азамат соғысы 1862 жылы басталды делінген (тарихи тұрғыдан — 1861 жылы). Солтүстік штаттар жеңіске жеткен соң құлдық жойылды. Президент Авраам Линкольн Гарриетті Ақ үйге шақырды, өйткені оның романы құлдықтың қатыгездігін түсінуге көмектесті.","ru":"Гарриет Бичер-Стоу жила в то время, когда рабство в Америке было законным. Она считала рабство неправильным и боролась против него. Вместе с мужем и детьми она помогала нескольким рабам бежать, пряча их в своём доме. Она участвовала в Подпольной железной дороге. Это была не настоящая железная дорога, а сеть людей, помогавших скрываться и добираться до северных штатов, где можно было обрести свободу.\n\nГарриет написала книгу «Хижина дяди Тома» о тяжёлой жизни рабов. Книга вышла в 1852 году и сильно повлияла на отношение людей к рабству.\n\nВ исходном тексте сказано, что Гражданская война началась в 1862 году (исторически — в 1861 году). После победы северных штатов рабство было отменено. Президент Авраам Линкольн пригласил Гарриет в Белый дом, поскольку её роман помог людям понять жестокость рабства."},"words":[{"word":"believed","syn":"thought","ru":"считала","kk":"деп санады"},{"word":"fought against","syn":"opposed","ru":"боролась против","kk":"қарсы күресті"},{"word":"escape","syn":"flee","ru":"сбежать","kk":"қашу"},{"word":"hide","syn":"conceal","ru":"прятать","kk":"жасыру"},{"word":"published","syn":"released","ru":"опубликованный","kk":"жарияланған"},{"word":"illegal","syn":"unlawful","ru":"незаконный","kk":"заңсыз"},{"word":"invited","syn":"asked to come","ru":"пригласил","kk":"шақырды"},{"word":"effect","syn":"impact","ru":"влияние","kk":"ықпал"}],"durationSeconds":59,"limit":59},{"file":"en-henry-ford-69.mp3","title":"Henry Ford","topic":"Промышленность и изобретения","level":"B1","questions":[{"q":"Who invented the automobile?","options":["Thomas Edison","Henry Ford","Siegfried Marcus","Karl Benz"],"correct":3,"why":"The passage identifies Karl Benz as the inventor of the first automobile."},{"q":"Why didn't most people buy cars when they first came on the market?","options":["People were afraid of automobiles at first","Cars were too noisy and smelly","Most people didn't earn enough money to buy one","There weren't many automobile dealerships where a car could be bought"],"correct":2,"why":"Early cars were too expensive for working-class people."},{"q":"Henry Ford's biggest achievement was what?","options":["He built a lot of factories to make cars","He invented the Model T","His assembly line process made cars cheap","He helped raise up the working class people"],"correct":2,"why":"The moving assembly line lowered production costs and made cars affordable."},{"q":"Using the assembly line, how long did it take to build a Model T?","options":["1 day","6 hours","12 hours","8 hours"],"correct":1,"why":"The text states that a Model T could be built in six hours."},{"q":"What reduced the costs of production of the Model T so that it became affordable to ordinary people?","options":["Assembly line production","Nothing did. People just liked the car","Ford decided to fire many employees to cut costs","The factories were very efficient"],"correct":0,"why":"Ford’s moving assembly line reduced production costs."},{"q":"In an assembly line, how is the automobile put together?","options":["People move in a line beside the car and put parts on it when they reach it","Each car is placed in different parts of the factory. Teams put each car together","The car is on a belt that moves through the factory, and people put a part on it as it passes them","The car is on a moving belt, and people run alongside it, putting it together"],"correct":2,"why":"Cars move through the factory while workers add parts as they pass."},{"q":"In what year did the Model T come out?","options":["1903","1908","1914","1920"],"correct":1,"why":"The passage says the Model T came out in 1908."},{"q":"Which group could afford cars after Ford reduced production costs?","options":["Only wealthy investors","Only automobile dealers","Farmers and factory workers","Only company executives"],"correct":2,"why":"The text names farmers, construction workers and factory workers as people who could buy a car."}],"transcript":"Most people think Henry Ford invented the automobile. Actually a German named Karl Benz invented the first automobile. Henry built a car, the Model T, that ordinary people could actually afford. There were a lot of cars when the Model T came out in 1908, but they were too expensive for working class people.\n\nFord developed a moving assembly line. The car would move through the factory and people would assemble parts on it as it moved past them. They could build a Model T in six hours. This reduced the costs of producing the cars so much that farmers and construction workers and the factory workers themselves could buy a car. Henry Ford put America on wheels.","translation":{"kk":"Көп адам автомобильді Генри Форд ойлап тапты деп санайды. Шын мәнінде алғашқы автомобильді Карл Бенц есімді неміс өнертапқышы жасаған. Генри Форд қарапайым адамдардың қалтасы көтеретін Model T көлігін шығарды. Model T 1908 жылы пайда болған кезде басқа да автомобильдер көп еді, бірақ олар жұмысшы тап үшін тым қымбат болатын.\n\nФорд қозғалмалы құрастыру желісін дамытты. Көлік зауыт ішінен жылжып өтіп, жұмысшылар оған бөлшектерді кезекпен орнататын. Осы әдіспен Model T көлігін алты сағатта құрастыруға болатын. Бұл өндіріс шығындарын азайтты, сондықтан фермерлер, құрылысшылар және зауыт жұмысшылары да автомобиль сатып ала алды. Генри Форд Американы автомобильмен қамтамасыз етуге үлкен үлес қосты.","ru":"Многие считают, что Генри Форд изобрёл автомобиль. На самом деле первый автомобиль изобрёл немец Карл Бенц. Генри Форд создал Model T — машину, которую могли позволить себе обычные люди. Когда Model T появилась в 1908 году, автомобилей уже было много, но они были слишком дорогими для рабочего класса.\n\nФорд разработал движущуюся сборочную линию. Машина перемещалась по заводу, а рабочие устанавливали детали по мере её движения. Model T можно было собрать за шесть часов. Это значительно снизило производственные затраты, и фермеры, строители и сами заводские рабочие смогли покупать автомобили. Генри Форд помог сделать автомобили массовыми в Америке."},"words":[{"word":"invent","syn":"create","kk":"ойлап табу","ru":"изобретать"},{"word":"automobile","syn":"car","kk":"автомобиль","ru":"автомобиль"},{"word":"ordinary people","syn":"regular people","kk":"қарапайым адамдар","ru":"обычные люди"},{"word":"afford","syn":"have enough money for","kk":"қалтасы көтеру","ru":"позволить себе"},{"word":"working class","syn":"wage earners","kk":"жұмысшы табы","ru":"рабочий класс"},{"word":"assembly line","syn":"production line","kk":"құрастыру желісі","ru":"сборочная линия"},{"word":"factory","syn":"plant","kk":"зауыт","ru":"завод"},{"word":"assemble","syn":"put together","kk":"құрастыру","ru":"собирать"},{"word":"parts","syn":"components","kk":"бөлшектер","ru":"детали"},{"word":"production costs","syn":"manufacturing expenses","kk":"өндіріс шығындары","ru":"производственные затраты"},{"word":"farmers","syn":"agricultural workers","kk":"фермерлер","ru":"фермеры"},{"word":"construction workers","syn":"builders","kk":"құрылысшылар","ru":"строители"}],"durationSeconds":null,"limit":null},{"file":"en-jessies-birthday-72.mp3","title":"Jessie's Birthday","topic":"Традиции и праздники","level":"A2","questions":[{"q":"What occasion is Jessie celebrating?","options":["Her birthday","Her graduation","New Year’s Day","Her wedding"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"Which item is commonly used for a birthday celebration?","options":["A birthday cake","A train timetable","A passport application","A weather forecast"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What do guests commonly bring to a birthday party?","options":["Presents","Laboratory equipment","Building permits","Traffic tickets"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What does a birthday mark?","options":["Another year since a person was born","The start of a new school semester","A change of season","A national election"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What do people often sing at birthday parties?","options":["Happy Birthday","A national anthem","A school bell","A weather report"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What do candles on a birthday cake often represent?","options":["Age","Height","Distance","Temperature"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What might Jessie do after opening her presents?","options":["Thank her guests","Apply for a driving license","Attend a business conference","Repair a computer"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What is the main purpose of a birthday gathering?","options":["To celebrate a person’s special day","To conduct a job interview","To announce exam results","To hold a formal debate"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."}],"transcript":"","translation":{"kk":"","ru":""},"words":[],"durationSeconds":null,"supplemental":true,"limit":null},{"file":"en-king-arthur-72.mp3","title":"The Legend of King Arthur","topic":"Литература и легенды","level":"B2","questions":[{"q":"Arthur was a king in which land?","options":["France","Spain","Britain","Saxony"],"correct":2},{"q":"Guinevere was a…","options":["Noble","Duchess","Commoner","Princess"],"correct":3},{"q":"A civil war is a war between…","options":["Two countries","Two continents","Two sides within a city","Two sides within a country"],"correct":3},{"q":"Why could Arthur not forgive the lovers?","options":["He was angry","The law forbade it","Lancelot was angry","Guinevere hated him"],"correct":0},{"q":"At the Round Table, Arthur sat…","options":["As an equal with his knights","On top of the table","On a platform","Outside"],"correct":0},{"q":"What was the dream of Camelot?","options":["To take over Britain","To invade Saxony","To build a kingdom based on honesty and equality","To build a large castle"],"correct":2},{"q":"Who was Arthur’s famous knight?","options":["Lancelot","Robin Hood","Beowulf","Merlin the Younger"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."},{"q":"What happened to Lancelot during the civil war?","options":["He was killed","He became king","He left for France as king","He founded a new Camelot"],"correct":0,"why":"Additional topic-practice question; not verified against the original audio."}],"transcript":"There is a story about Arthur Pendragon, a king in Britain in the fifth century. He was known to be honest and fair in his dealings with all men and women, whether they were nobles or peasants. Gathering a group of knights to him, he created a court called Camelot. Meetings to discuss problems were held at a large Round Table, where Arthur sat as an equal with his knights.\n\nArthur married Guinevere, a princess. But she fell in love with Arthur's finest knight, Lancelot, and he with her. While Arthur would have been able to forgive the lovers, the laws of Camelot would not let him.\n\nA civil war followed between the followers of Arthur and those of Lancelot. Lancelot was killed. Eventually, so was Arthur. Guinevere became a nun and lived the rest of her life in silence. The dream of Camelot was lost.","translation":{"kk":"Бесінші ғасырда Британияда билік еткен Артур Пендрагон туралы аңыз бар. Ол ақсүйектерге де, шаруаларға да адал әрі әділ қарауымен танылған. Артур айналасына серілерді жинап, Камелот атты сарай құрды. Мәселелер үлкен Дөңгелек үстел басында талқыланды, онда Артур серілерімен тең дәрежеде отырды.\n\nАртур Гвиневра есімді ханшайымға үйленді. Бірақ Гвиневра Артурдың ең үздік серісі Ланселотқа ғашық болды, Ланселот та оны сүйді. Артур оларды кешіре алар еді, алайда Камелот заңдары бұған жол бермеді.\n\nАртур мен Ланселоттың жақтастары арасында азамат соғысы басталды. Ланселот қаза тапты, кейін Артур да қайтыс болды. Гвиневра монах әйел болып, қалған өмірін үнсіз өткізді. Камелот туралы арман жоғалды.","ru":"Существует легенда об Артуре Пендрагоне, короле Британии пятого века. Он был известен своей честностью и справедливостью в отношениях со всеми людьми — как со знатью, так и с крестьянами. Собрав вокруг себя рыцарей, он создал двор под названием Камелот. Вопросы обсуждали за большим Круглым столом, где Артур сидел наравне со своими рыцарями.\n\nАртур женился на принцессе Гвиневре. Но она полюбила лучшего рыцаря Артура, Ланселота, а он полюбил её. Артур мог бы простить влюблённых, однако законы Камелота не позволяли ему этого.\n\nМежду сторонниками Артура и Ланселота началась гражданская война. Ланселот погиб, а позднее погиб и Артур. Гвиневра стала монахиней и провела остаток жизни в молчании. Мечта о Камелоте была утрачена."},"words":[{"word":"honest","syn":"truthful","ru":"честный","kk":"адал"},{"word":"fair","syn":"just","ru":"справедливый","kk":"әділ"},{"word":"knights","syn":"warriors","ru":"рыцари","kk":"серілер"},{"word":"gathering","syn":"assembling","ru":"собирая","kk":"жинап"},{"word":"forgive","syn":"pardon","ru":"прощать","kk":"кешіру"},{"word":"followers","syn":"supporters","ru":"сторонники","kk":"жақтастар"},{"word":"eventually","syn":"finally","ru":"в конце концов","kk":"ақырында"},{"word":"dream","syn":"ideal","ru":"мечта, идеал","kk":"арман, мұрат"}],"durationSeconds":53,"supplemental":true,"limit":53},{"file":"en-learning-another-language-72.mp3","title":"How to Learn Another Language","topic":"Язык и образование","level":"B1","questions":[{"q":"How many people speak a second language?","options":["65 - 70 million","50 - 80 million","50 - 80 percent","65 - 70 percent"],"correct":3,"ru":"","kk":"","why":""},{"q":"Can you learn a second language as an adult?","options":["Yes","No","Maybe","Never"],"correct":0,"ru":"","kk":"","why":""},{"q":"How many words do you need to learn to be fluent in another language?","options":["100","10,000","100,000","1,000"],"correct":1,"ru":"","kk":"","why":""},{"q":"What is an accent?","options":["The way you pronounce words","The household where you grew up","Vocabulary and grammar","The way you study"],"correct":0,"ru":"","kk":"","why":""},{"q":"What is \"input\" when learning a second language?","options":["Reading and writing","Reading and listening","Listening and speaking","Speaking and writing"],"correct":1,"ru":"","kk":"","why":""},{"q":"How do you learn to speak another language?","options":["Input and output","Input and putput","Inside and outgoing","Inside and outside"],"correct":0,"ru":"","kk":"","why":""},{"q":"What percentage of people speak a second language?","options":["65–70 million","50–80 million","50–80 percent","65–70 percent"],"correct":3},{"q":"Can adults learn a second language?","options":["Yes","No","Maybe not","Never"],"correct":0}],"transcript":"It's estimated that between 65 - 70 percent of people speak a second language. Many of them grew up in diverse households with multiple cultures under the same roof, so they learned to speak different languages as children. However, some people learn another language as an adult.\n\nLearning a second language is hard. To be truly fluent, you have to learn around 10,000 words. You also have to study things like vocabulary and grammar. You might even have an accent, which is a way of pronouncing words that's unique to your country or culture.\n\nThere are two aspects of learning another language. The first is called input, and it involves reading and listening. The second is called output, and it involves writing and speaking.\n\nIf you want to be successful with learning a second language, you'll need to study both input and output. Good luck!","translation":{"kk":"Есептеулер бойынша, адамдардың 65–70 пайызы екінші тілде сөйлейді. Олардың көбі бір шаңырақ астында бірнеше мәдениет тоғысқан отбасыларда өскен, сондықтан бала кезінен әртүрлі тілде сөйлеуді үйренген. Алайда кейбір адамдар басқа тілді ересек кезінде меңгереді.\n\nЕкінші тілді үйрену қиын. Тілді еркін меңгеру үшін шамамен 10 000 сөз білу керек. Сонымен қатар сөздік қор мен грамматиканы оқу қажет. Сізде акцент болуы мүмкін — бұл еліңізге немесе мәдениетіңізге тән сөздерді айту ерекшелігі.\n\nБасқа тілді үйренудің екі жағы бар. Біріншісі — input, яғни оқу мен тыңдау арқылы ақпаратты қабылдау. Екіншісі — output, яғни жазу және сөйлеу арқылы тілді қолдану.\n\nЕкінші тіл
